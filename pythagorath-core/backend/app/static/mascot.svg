<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" width="200" height="260" role="img" aria-label="فيثاغورث — الطفل العُماني">
  <!-- SVG re-creation of the brand character (Omani boy waving). Replace this file
       with the official PNG/SVG illustration to use the exact brand art. -->
  <ellipse cx="100" cy="248" rx="56" ry="9" fill="#15324a" opacity="0.10"/>
  <!-- waving arm (his right / our left-top) -->
  <g stroke="#2f2a26" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
    <path d="M70,118 C50,108 38,86 36,62" fill="none" stroke="#ffffff" stroke-width="15"/>
    <circle cx="34" cy="56" r="12" fill="#F3C9A0"/>
    <path d="M28,52 l-3,-9 M34,49 l0,-10 M40,51 l4,-9" stroke="#F3C9A0" stroke-width="6"/>
  </g>
  <!-- dishdasha -->
  <path d="M68,112 C49,150 45,208 49,238 L151,238 C155,208 151,150 132,112 C124,128 76,128 68,112 Z"
        fill="#ffffff" stroke="#E2E6EA" stroke-width="2.5"/>
  <path d="M100,120 L100,236" stroke="#EAEDF0" stroke-width="2"/>
  <path d="M90,118 q10,9 20,0" fill="none" stroke="#EAEDF0" stroke-width="2"/>
  <!-- backpack straps -->
  <path d="M78,116 C74,150 74,180 76,206" fill="none" stroke="#F39A1F" stroke-width="9" stroke-linecap="round"/>
  <path d="M122,116 C126,150 126,180 124,206" fill="none" stroke="#F39A1F" stroke-width="9" stroke-linecap="round"/>
  <!-- holding arm + book (his left / our right) -->
  <path d="M134,122 C150,134 156,150 150,166" fill="none" stroke="#ffffff" stroke-width="15" stroke-linecap="round"/>
  <rect x="138" y="150" width="40" height="30" rx="5" fill="#29A9E0" stroke="#1B7FB0" stroke-width="2.5"/>
  <path d="M158,150 L158,180" stroke="#1B7FB0" stroke-width="2.5"/>
  <circle cx="150" cy="168" r="11" fill="#F3C9A0" stroke="#2f2a26" stroke-width="2"/>
  <!-- shoes -->
  <ellipse cx="80" cy="240" rx="15" ry="8" fill="#E08A3C" stroke="#C2741F" stroke-width="2"/>
  <ellipse cx="120" cy="240" rx="15" ry="8" fill="#E08A3C" stroke="#C2741F" stroke-width="2"/>
  <!-- head -->
  <circle cx="100" cy="80" r="35" fill="#F3C9A0" stroke="#E3B488" stroke-width="1.5"/>
  <!-- ears -->
  <circle cx="65" cy="82" r="7" fill="#F3C9A0"/><circle cx="135" cy="82" r="7" fill="#F3C9A0"/>
  <!-- kummah (Omani cap) -->
  <path d="M64,70 C66,40 134,40 136,70 C112,60 88,60 64,70 Z" fill="#C9A36A" stroke="#A6824B" stroke-width="2"/>
  <g fill="#A6824B" opacity="0.8">
    <circle cx="80" cy="58" r="2"/><circle cx="92" cy="53" r="2"/><circle cx="104" cy="52" r="2"/>
    <circle cx="116" cy="55" r="2"/><circle cx="98" cy="62" r="2"/><circle cx="86" cy="64" r="2"/><circle cx="112" cy="63" r="2"/>
  </g>
  <path d="M64,70 C88,60 112,60 136,70" fill="none" stroke="#A6824B" stroke-width="2.5"/>
  <!-- glasses -->
  <g stroke="#3A3A3A" stroke-width="3" fill="#ffffff" fill-opacity="0.35">
    <circle cx="86" cy="84" r="12"/><circle cx="114" cy="84" r="12"/>
    <path d="M98,84 h4" /><path d="M74,82 l-9,-2" fill="none"/><path d="M126,82 l9,-2" fill="none"/>
  </g>
  <!-- happy closed eyes -->
  <path d="M81,84 q5,-6 10,0 M109,84 q5,-6 10,0" fill="none" stroke="#3A3A3A" stroke-width="2.5" stroke-linecap="round"/>
  <!-- cheeks -->
  <circle cx="74" cy="96" r="5" fill="#F6A98B" opacity="0.6"/><circle cx="126" cy="96" r="5" fill="#F6A98B" opacity="0.6"/>
  <!-- big smile -->
  <path d="M84,98 Q100,118 116,98 Q100,108 84,98 Z" fill="#7a3b2e"/>
  <path d="M88,100 Q100,110 112,100 Z" fill="#ffffff"/>
</svg>
