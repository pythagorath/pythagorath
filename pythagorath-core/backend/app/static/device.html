<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>جهاز الطالب — فيثاغورث</title>
<link rel="stylesheet" href="/static/brand.css">
<style>
  /* Visual design merged from the Claude Design "جهاز الطالب" mock (dark-teal). Colours,
     shadows, animations, the mascot (نُمير), the 4-cell code box and the card/grid layout are
     the design's REAL values. All behaviour is unchanged: boot/doPair/selfPick/pickChild/
     chooseSecret/unpair, the same API paths, and the 12-emoji PICS list (mirrors the server). */
  *{ box-sizing:border-box; } html,body{ margin:0; max-width:100%; overflow-x:hidden; }
  body{ font-family:'Readex Pro',sans-serif; color:#16475c; min-height:100vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:12px 18px 34px; position:relative; overflow:hidden;
    background:#0c4456;                                                   /* design root (dark teal) */
    background-image:radial-gradient(125% 120% at 82% -8%,#0E9C93 0%,#155E7D 48%,#0c4d66 100%); }
  ::selection{ background:#F39A1F; color:#fff; }
  /* decorative blobs */
  .blobs{ position:absolute; inset:0; pointer-events:none; }
  .blobs i{ position:absolute; border-radius:50%; filter:blur(8px); display:block; }
  .blobs .b1{ top:-90px; right:-70px; width:300px; height:300px; background:rgba(243,154,31,.18); animation:blobDrift 11s ease-in-out infinite; }
  .blobs .b2{ bottom:-110px; left:-80px; width:340px; height:340px; background:rgba(46,200,150,.16); animation:blobDrift 14s ease-in-out infinite reverse; }
  .shell{ width:100%; max-width:520px; position:relative; z-index:2; }
  .brand{ text-align:center; margin-bottom:64px; font-family:'Baloo Bhaijaan 2',cursive; font-weight:800; font-size:26px; color:#FFD27E; text-shadow:0 2px 12px rgba(8,40,55,.45); }
  .brand-logo{ height:46px; width:auto; display:block; margin:0 auto; filter:drop-shadow(0 3px 14px rgba(8,40,55,.5)); }
  .brand small{ display:block; font-family:'Readex Pro',sans-serif; font-weight:300; font-size:13px; color:#bfe9e3; margin-top:8px; letter-spacing:.5px; }
  /* card */
  .card-shell{ position:relative; z-index:2; width:100%; max-width:520px; margin:0 auto; background:#FFFBF4; border-radius:30px; box-shadow:0 30px 70px rgba(8,40,55,.34); animation:popIn .35s ease; }
  .mascot{ display:flex; justify-content:center; margin-top:-54px; filter:drop-shadow(0 14px 18px rgba(8,40,55,.22)); animation:floaty 5s ease-in-out infinite; }
  .mascot svg{ width:110px; height:110px; display:block; }
  .card-pad{ padding:6px 40px 34px; text-align:center; }
  h2{ font-family:'Baloo Bhaijaan 2',cursive; font-weight:800; font-size:30px; color:#155E7D; margin:6px 0 0; }
  .muted{ font-size:16px; font-weight:300; line-height:1.9; color:#3a6577; margin:10px auto 0; max-width:380px; }
  /* code: four cells fed by a hidden input (doPair still reads #code) */
  .code-row{ display:flex; justify-content:center; gap:14px; margin-top:26px; direction:ltr; cursor:text; }
  .digit-cell{ width:64px; height:78px; border-radius:18px; display:flex; align-items:center; justify-content:center;
    font-family:'Baloo Bhaijaan 2',cursive; font-weight:800; font-size:38px; color:#155E7D;
    background:#F4EFE6; border:3px solid #e2dccf; transition:border-color .15s, box-shadow .15s, background .15s; }
  .digit-cell.next{ border-color:#0E9C93; box-shadow:0 0 0 3px rgba(14,156,147,.12); }
  .digit-cell.filled{ background:#fff; border-color:#F39A1F; box-shadow:0 8px 16px rgba(243,154,31,.18); }
  .code-hidden{ position:absolute; opacity:0; width:1px; height:1px; pointer-events:none; }
  .bigbtn{ width:100%; margin-top:24px; border:none; cursor:pointer; padding:18px; border-radius:16px;
    font-family:'Baloo Bhaijaan 2',cursive; font-weight:700; font-size:21px; color:#fff;
    background:linear-gradient(135deg,#F39A1F,#F8A93A); box-shadow:0 14px 30px rgba(243,154,31,.42);
    transition:transform .15s ease, box-shadow .15s ease, filter .15s ease; }
  .bigbtn:hover{ transform:translateY(-3px); filter:brightness(1.03); } .bigbtn:active{ transform:translateY(0); }
  .err{ min-height:22px; margin-top:14px; color:#E0483A; font-size:14px; font-weight:500; }
  /* student grid */
  .child-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-top:26px; }
  .opt{ cursor:pointer; transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease; }
  .opt:hover{ transform:translateY(-4px); }
  .child-grid .opt{ background:#fff; border:2.5px solid #eef1ef; border-radius:22px; padding:18px 10px 16px; box-shadow:0 8px 18px rgba(21,94,125,.06); }
  .child-grid .opt:hover{ border-color:#0E9C93; box-shadow:0 16px 30px -14px rgba(14,156,147,.32); }
  .av{ width:70px; height:70px; margin:0 auto; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-family:'Baloo Bhaijaan 2',cursive; font-weight:800; font-size:32px; color:#fff;
    background:linear-gradient(140deg,#0E9C93,#155E7D); box-shadow:0 8px 16px rgba(14,156,147,.32); }
  /* the design's 4-colour avatar cycle, applied by position */
  .child-grid .opt:nth-child(4n+1) .av{ background:linear-gradient(140deg,#F39A1F,#F8A93A); box-shadow:0 8px 16px rgba(243,154,31,.32); }
  .child-grid .opt:nth-child(4n+2) .av{ background:linear-gradient(140deg,#0E9C93,#155E7D); box-shadow:0 8px 16px rgba(14,156,147,.32); }
  .child-grid .opt:nth-child(4n+3) .av{ background:linear-gradient(140deg,#7C5CE0,#9B7BEA); box-shadow:0 8px 16px rgba(124,92,224,.32); }
  .child-grid .opt:nth-child(4n+4) .av{ background:linear-gradient(140deg,#2BB673,#3ED48C); box-shadow:0 8px 16px rgba(43,182,115,.32); }
  .nm{ font-weight:600; font-size:16px; color:#155E7D; margin-top:12px; }
  /* secret-picture grid */
  .pic-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-top:24px; }
  .pic-grid .opt{ aspect-ratio:1; display:flex; align-items:center; justify-content:center; font-size:38px;
    border-radius:18px; background:#FFF6E8; border:3px solid #f0e7d6; box-shadow:0 6px 14px rgba(21,94,125,.07); }
  .pic-grid .opt:nth-child(2n){ background:#fff; }
  .pic-grid .opt:hover{ border-color:#0E9C93; box-shadow:0 12px 22px -12px rgba(14,156,147,.32); }
  /* unlink */
  .foot{ margin-top:24px; padding-top:20px; border-top:1px solid #ede6da; }
  .foot a{ color:#9aa6a3; font-size:14px; font-weight:500; text-decoration:none; cursor:pointer; }
  .foot a:hover{ color:#155E7D; } .foot a b{ color:#F39A1F; font-weight:600; }
  .empty{ padding:8px 0 4px; } .empty .em{ font-size:54px; line-height:1; }
  @keyframes floaty{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-10px); } }
  @keyframes wiggle{ 0%,100%{ transform:rotate(-6deg); } 50%{ transform:rotate(10deg); } }
  @keyframes popIn{ 0%{ transform:scale(.96); opacity:.4; } 100%{ transform:scale(1); opacity:1; } }
  @keyframes blobDrift{ 0%,100%{ transform:translate(0,0) scale(1); } 50%{ transform:translate(24px,-18px) scale(1.08); } }
  @media (max-width:560px){
    .card-pad{ padding:30px 22px 26px; }
    h2{ font-size:26px; }
    .child-grid{ grid-template-columns:repeat(2,1fr); }
    .digit-cell{ width:58px; height:70px; font-size:34px; }
  }
  @media (max-width:380px){
    .digit-cell{ width:50px; height:62px; font-size:30px; }
    .pic-grid{ gap:10px; }
  }
</style>
</head>

<script src="/static/site.js"></script>
<script>
const H = n => String(n==null?'':n).replace(/[0-9]/g, d=>'٠١٢٣٤٥٦٧٨٩'[+d]);
const V = document.getElementById('view');
async function api(path, opts){
  const r = await fetch(path, opts);
  if(!r.ok){ const e=new Error('err'); e.status=r.status; try{ e.detail=(await r.json()).detail; }catch(_){} throw e; }
  return r.status===204?null:r.json();
}
// the unlink footer — shared across views (design markup; behaviour = unpair, unchanged)
function unlinkFoot(){ return `<div class="foot"><a onclick="unpair()">ليس جهازك؟ <b>فكّ الربط</b></a></div>`; }

async function boot(){
  try{ const d = await api('/api/device/children'); selfPick(d.children); }   // already paired
  catch(e){ codeEntry(); }                                                     // needs a code
}

// ---- visual helpers for the 4-cell code box (the hidden #code input stays the source of truth) ----
function renderCells(code){
  const box=document.getElementById('cells'); if(!box) return;
  let html='';
  for(let i=0;i<4;i++){
    const filled=i<code.length, next=i===code.length;
    html += `<div class="digit-cell${filled?' filled':(next?' next':'')}">${filled?H(code[i]):''}</div>`;
  }
  box.innerHTML=html;
}
function focusCode(){ const i=document.getElementById('code'); if(i) i.focus(); }
function onCode(){ const i=document.getElementById('code'); i.value=i.value.replace(/[^0-9]/g,''); renderCells(i.value); }

function codeEntry(msg){
  V.innerHTML = `<h2>جهاز الطالب</h2>
    <p class="muted">اطلب رمز الربط (٤ أرقام) وأدخله هنا</p>
    <div class="code-row" id="cells" onclick="focusCode()"></div>
    <input class="code-hidden" id="code" inputmode="numeric" maxlength="4" oninput="onCode()">
    <div class="err" id="cerr">${msg||''}</div>
    <button class="bigbtn" onclick="doPair()">ربط الجهاز</button>
    ${unlinkFoot()}`;
  renderCells('');
  setTimeout(focusCode, 60);
}
async function doPair(){
  const code=(document.getElementById('code').value||'').trim();
  const err=document.getElementById('cerr'); err.textContent='';
  if(code.length<4){ err.textContent='أدخل الرمز كاملاً (٤ أرقام).'; return; }
  try{ const d=await api('/api/auth/pair',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code})});
    selfPick(d.children); }
  catch(e){ err.textContent = e.detail || 'رمز غير صالح أو منتهٍ.'; renderCells(code); }
}

function selfPick(kids){
  if(!kids || !kids.length){
    V.innerHTML = `<div class="empty"><div class="em">🐣</div><h2>لا يوجد طلاب بعد</h2>
      <p class="muted">اطلب إضافة طالب أولاً من حساب وليّ الأمر، ثم عُد للدخول من هنا.</p></div>
      ${unlinkFoot()}`;
    return;
  }
  V.innerHTML = `<h2>مَن أنت؟</h2><p class="muted">اختر اسمك للدخول</p>
    <div class="child-grid">${kids.map(k=>`<div class="opt" onclick="pickChild(${k.id},'${(k.name||'').replace(/'/g,'')}',${k.has_secret?1:0})">
      <div class="av">${(k.name||'؟').trim()[0]}</div><div class="nm">${k.name}</div></div>`).join('')}</div>
    ${unlinkFoot()}`;
}
const PICS = ["🐶","🐱","⭐","⚽","🍎","🦋","🌙","🚗","🌸","🐠","🎈","🦁"];   // mirrors auth.SECRET_PICTURES
function pickChild(id, name, hasSecret){
  V.innerHTML = `<h2>أهلاً ${name}! 👋</h2>
    <p class="muted">${hasSecret?'اختر صورتك السرّية للدخول.':'هي مفتاح دخولك — اخترها وتذكّرها.'}</p>
    <div class="pic-grid">${PICS.map(p=>`<div class="opt" onclick="chooseSecret(${id},'${p}')">${p}</div>`).join('')}</div>
    <div class="err" id="serr"></div>
    ${unlinkFoot()}`;
}
async function chooseSecret(id, pic){
  const err=document.getElementById('serr'); if(err) err.textContent='';
  try{ await api('/api/device/child-login',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({student_id:id, secret_picture:pic})});
    location.href='/child';                       // → child mode (the real adventure)
  }catch(e){ if(err) err.textContent = e.status===401 ? 'ليست صورتك السرّية — حاوِل مرّة أخرى.' : (e.detail||'تعذّر الدخول'); }
}
async function unpair(){ try{ await api('/api/auth/device-logout',{method:'POST'}); }catch(e){} codeEntry(); }

boot();
</script>
</body>
</html>
