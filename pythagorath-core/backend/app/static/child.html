<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مغامرتي — فيثاغورث</title>
<!-- brand.css imports the fonts + colour tokens + the shared .frac stacked-fraction style -->
<link rel="stylesheet" href="/static/brand.css">
<style>
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    font-family:'Readex Pro',sans-serif; color:#143A1F; min-height:100vh;
    background:#F4FAF6;
    background-image:
      radial-gradient(60% 32% at 90% 0%,rgba(243,154,31,.16),transparent 62%),
      radial-gradient(56% 30% at 8% 5%,rgba(41,169,224,.16),transparent 62%);
  }
  @keyframes bobn{ 0%,100%{transform:translateY(0) rotate(-2deg)} 50%{transform:translateY(-7px) rotate(2deg)} }
  @keyframes pulsen{ 0%,100%{box-shadow:0 0 0 0 rgba(41,169,224,.5),0 14px 24px -12px rgba(14,110,156,.7)} 50%{box-shadow:0 0 0 15px rgba(41,169,224,0),0 14px 24px -12px rgba(14,110,156,.7)} }
  @keyframes twinkle{ 0%,100%{opacity:.4;transform:scale(.8)} 50%{opacity:1;transform:scale(1.15)} }
  .wrap{ max-width:540px; margin:0 auto; padding:26px 16px 64px; }
  .err{ text-align:center; padding:60px 16px; color:#7E9488; font-size:17px; }

  .brandbar{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px; padding:0 4px; }
  .brandbar .logo{ font-family:'Baloo Bhaijaan 2',cursive; font-weight:800; font-size:18px; color:#D97E0A; }
  .brandbar .tag{ font-size:12.5px; color:#9DB4A6; font-weight:600; }

  /* top bar — avatar + greeting + name + coins/streak */
  .topbar{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
           background:linear-gradient(135deg,#163E52,#1B6E97 70%,#1E84B6); color:#fff;
           border-radius:22px; padding:15px 18px; box-shadow:0 22px 44px -26px rgba(21,94,125,.75); }
  .avatar{ display:inline-flex; align-items:center; justify-content:center; width:42px; height:42px; border-radius:50%;
           background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.25);
           font-family:'Baloo Bhaijaan 2',cursive; font-weight:800; font-size:20px; }
  .hello{ font-size:12px; color:rgba(255,255,255,.72); margin-bottom:1px; }
  .who{ font-family:'Baloo Bhaijaan 2',cursive; font-weight:800; font-size:22px; line-height:1; }
  .pills{ display:flex; gap:8px; }
  .pill{ display:inline-flex; align-items:center; gap:7px; background:rgba(255,255,255,.16);
         border:1px solid rgba(255,255,255,.24); border-radius:999px; padding:8px 13px; font-weight:800; font-size:16px; }
  .pill svg{ width:18px; height:18px; flex:0 0 auto; }

  /* CTA — current station + GO */
  .cta{ position:relative; overflow:hidden; background:#fff; border:1px solid #E6EFE9; border-radius:24px;
        padding:20px; margin:15px 0 8px; text-align:center; box-shadow:0 18px 36px -24px rgba(21,94,125,.55); }
  .cta .pi{ position:absolute; left:-18px; top:-30px; font-family:'Baloo Bhaijaan 2',cursive; font-size:130px;
            color:#178FC9; opacity:.05; line-height:1; }
  .cta .lead{ position:relative; color:#8A9D90; font-size:14px; font-weight:600; margin-bottom:5px;
              display:flex; align-items:center; justify-content:center; gap:7px; }
  .cta .lead svg{ width:17px; height:17px; color:#37B6E6; }
  .cta .skill{ position:relative; font-family:'Baloo Bhaijaan 2',cursive; font-weight:800; font-size:23px; color:#155E7D; line-height:1.35; }
  .cta .reason{ position:relative; display:inline-block; margin-top:9px; background:#E6F4FB; color:#178FC9;
                border-radius:999px; padding:5px 15px; font-size:13.5px; font-weight:700; }
  .gobtn{ position:relative; display:flex; align-items:center; justify-content:center; gap:9px; width:100%; margin-top:16px;
          border:0; cursor:pointer; font-family:'Baloo Bhaijaan 2',cursive; font-weight:800; font-size:23px; color:#fff;
          background:linear-gradient(135deg,#F9AC36,#E8833A); border-radius:18px; padding:16px 20px;
          box-shadow:0 16px 28px -12px rgba(217,126,10,.7); transition:transform .08s; }
  .gobtn:hover{ transform:translateY(-2px); } .gobtn:active{ transform:translateY(1px); }
  .gobtn svg{ width:22px; height:22px; }

  /* journey title */
  .jtitle{ display:flex; align-items:center; justify-content:center; gap:9px; margin:28px 0 8px; }
  .jtitle svg{ width:22px; height:22px; color:#1E945B; flex:0 0 auto; }
  .jtitle h2{ font-family:'Baloo Bhaijaan 2',cursive; font-weight:800; font-size:20px; color:#1B6E45; margin:0; }

  /* the data-driven trail (any number of stations, long names safe) */
  .trail{ position:relative; margin:6px auto 0; }
  .srow{ display:flex; align-items:center; gap:14px; min-height:88px; }
  .rail{ position:relative; flex:0 0 64px; align-self:stretch; display:flex; align-items:center; justify-content:center; }
  .conn{ position:absolute; right:calc(50% - 3px); width:6px; background:#E4EDE7; border-radius:3px; }
  .conn.top{ top:0; height:50%; } .conn.bot{ bottom:0; height:50%; }
  .conn.done{ background:linear-gradient(180deg,#FFC766,#F0941D); }
  .conn.up{ background:#E4EDE7; opacity:.0; }                   /* hidden segment (first/last edges) */
  .dot{ position:relative; z-index:2; width:54px; height:54px; border-radius:50%;
        display:flex; align-items:center; justify-content:center; border:3px solid transparent; }
  .dot svg{ width:25px; height:25px; }
  .dot.mastered{ background:linear-gradient(135deg,#FFD27E,#F39A1F); border-color:#E68A0C;
                 box-shadow:0 12px 20px -10px rgba(217,126,10,.75); color:#fff; }
  .dot.available{ background:#fff; border-color:#9FD3EC; color:#178FC9; }
  .dot.current{ width:62px; height:62px; background:linear-gradient(135deg,#37B6E6,#178FC9); border-color:#0E6E9C;
                color:#fff; animation:pulsen 1.9s ease-out infinite; }
  .dot.locked{ background:#EDF1EE; border-color:#DCE3DD; color:#A9B4AC; }
  .lab{ flex:1; }
  .labcard{ display:inline-block; border-radius:14px; padding:9px 14px; font-size:15px; font-weight:700; line-height:1.5; }
  .lab.mastered .labcard{ background:#fff; border:1px solid #EEE7DB; color:#5B6B61; box-shadow:0 8px 18px -14px rgba(21,94,125,.6); }
  .lab.available .labcard{ background:#fff; border:1px solid #E6EFE9; color:#2C3A43; box-shadow:0 8px 18px -14px rgba(21,94,125,.5); }
  .lab.current .labcard{ background:linear-gradient(135deg,#37B6E6,#178FC9); color:#fff; box-shadow:0 12px 22px -12px rgba(14,110,156,.8); }
  .lab.locked .labcard{ background:#F3F6F3; border:1px dashed #D6DED7; color:#A4AFA7; }
  /* نُمَيْر beside the current station */
  .namir{ position:relative; display:inline-block; width:74px; vertical-align:middle; margin-left:6px; animation:bobn 4.2s ease-in-out infinite; }
  .namir .bubble{ position:absolute; right:-2px; top:-26px; background:#fff; border:1px solid #E6EFE9; border-radius:12px;
                  padding:3px 9px; font-size:11px; font-weight:700; color:#1B6E45; white-space:nowrap;
                  box-shadow:0 8px 16px -12px rgba(21,94,125,.6); }
  .namir svg{ width:74px; height:74px; display:block; }
  /* treasure goal at the end */
  .dot.treasure{ background:#EDF1EE; border-color:#DCE3DD; color:#A9B4AC; width:58px; height:58px; }
  .twink{ position:absolute; right:8px; top:-2px; color:#F0A82B; animation:twinkle 2.4s ease-in-out infinite; }
  .twink svg{ width:16px; height:16px; }
</style>
</head>
<body data-surface="child">
<div class="wrap" id="app"><div class="err">… جارٍ التحميل</div></div>
<script src="/static/widgets.js"></script>
<script>
// ---------- mandatory UI helpers ----------
const H = n => String(n).replace(/[0-9]/g, d => '٠١٢٣٤٥٦٧٨٩'[+d]);
// Arabic fraction + Hindi numerals — the SHARED stackFrac() (widgets.js), so Hindi (١/٢) and
// Latin (1/2) fractions both stack identically across every surface.
function ar(s){ return stackFrac(s); }

let SID = null, CHILD_MODE = false;

// ---------- brand SVG art (from Claude Design) ----------
const SVG = {
  coin:'<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.5" fill="#FFD27E" stroke="#F0A82B" stroke-width="1.4"/><circle cx="12" cy="12" r="5.4" fill="none" stroke="#E08A1E" stroke-width="1.3" opacity=".6"/><path d="M12 8.6v6.8M13.7 10.1c0-.8-.85-1.3-1.9-1.3s-1.9.45-1.9 1.25.78 1.05 1.9 1.2 2 .5 2 1.35-.85 1.3-2 1.3-2-.45-2-1.3" stroke="#B5710F" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  flame:'<svg viewBox="0 0 24 24" fill="none"><path d="M12.5 3c.3 2.6-1.4 3.4-2.4 5-1.1 1.8-.4 4 1 4.6 .2-1 .9-1.6 1.4-2.4 .9 1 2 2 2 3.7a4.4 4.4 0 1 1-8.8 .2c0-3.7 3.9-4.8 3.4-9.1 1 .6 2.4 1.9 2.4 4-.1.7-.1 1.4-.4 2" fill="#FF9F45" stroke="#F0731F" stroke-width="1.2" stroke-linejoin="round"/></svg>',
  pin:'<svg viewBox="0 0 24 24" fill="none"><path d="M12 21s6.5-5.4 6.5-10.5a6.5 6.5 0 1 0-13 0C5.5 15.6 12 21 12 21z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="10.3" r="2.3" stroke="currentColor" stroke-width="1.8"/></svg>',
  play:'<svg viewBox="0 0 24 24" fill="none"><path d="M9 6l8 6-8 6z" fill="currentColor"/></svg>',
  playW:'<svg viewBox="0 0 24 24" fill="none"><path d="M9 6l9 6-9 6z" fill="#fff"/></svg>',
  star:'<svg viewBox="0 0 24 24" fill="none"><path d="M12 4l2.2 4.5 5 .7-3.6 3.5.85 5L12 15.9 7.55 17.7l.85-5L4.8 9.2l5-.7z" fill="#fff"/></svg>',
  lock:'<svg viewBox="0 0 24 24" fill="none"><rect x="6" y="10.5" width="12" height="9" rx="2.2" fill="currentColor"/><path d="M8.4 10.5V8a3.6 3.6 0 0 1 7.2 0v2.5" stroke="currentColor" stroke-width="2" fill="none"/></svg>',
  map:'<svg viewBox="0 0 24 24" fill="none"><path d="M9 4 4 6.2v13.3l5-2.2 6 2.2 5-2.2V6l-5 2.2-6-2.2z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M9 4v13.3M15 6.4v13.3" stroke="currentColor" stroke-width="1.7"/></svg>',
  chest:'<svg viewBox="0 0 24 24" fill="none"><rect x="4.5" y="9.5" width="15" height="9.5" rx="2" fill="currentColor"/><path d="M4.5 13h15" stroke="#EDF1EE" stroke-width="1.5"/><rect x="10.5" y="11.5" width="3" height="3.4" rx="1" fill="#EDF1EE"/><path d="M7 9.5a5 5 0 0 1 10 0" stroke="currentColor" stroke-width="2" fill="none"/></svg>',
  twinkle:'<svg viewBox="0 0 24 24"><path d="M12 3l1.6 6.4L20 11l-6.4 1.6L12 19l-1.6-6.4L4 11l6.4-1.6z" fill="currentColor"/></svg>',
  // نُمَيْر — الشخصية الموحّدة (الهوية الرسمية)
  namir:'<svg viewBox="0 0 300 300" fill="none"><defs><radialGradient id="numBodyC" cx="38%" cy="30%" r="78%"><stop offset="0%" stop-color="#FFD27E"/><stop offset="38%" stop-color="#F9AC36"/><stop offset="78%" stop-color="#F1991F"/><stop offset="100%" stop-color="#DD7E05"/></radialGradient><radialGradient id="numCapC" cx="35%" cy="30%" r="75%"><stop offset="0%" stop-color="#86D8CE"/><stop offset="100%" stop-color="#0E9C93"/></radialGradient></defs><g><line x1="160" y1="40" x2="146" y2="22" stroke="#8FDACF" stroke-width="3" stroke-linecap="round"/><line x1="160" y1="40" x2="182" y2="28" stroke="#8FDACF" stroke-width="3" stroke-linecap="round"/><circle cx="144" cy="20" r="5" fill="#11A79C"/><circle cx="184" cy="26" r="5" fill="#11A79C"/><path d="M150 66 Q150 48 160 40" stroke="#EE9420" stroke-width="6" stroke-linecap="round" fill="none"/><circle cx="160" cy="38" r="11" fill="url(#numCapC)"/></g><path d="M76 156 Q46 126 42 96" stroke="#EE9420" stroke-width="23" stroke-linecap="round" fill="none"/><path d="M224 158 Q254 178 256 204" stroke="#EE9420" stroke-width="23" stroke-linecap="round" fill="none"/><ellipse cx="150" cy="180" rx="112" ry="116" fill="url(#numBodyC)"/><ellipse cx="112" cy="120" rx="56" ry="38" fill="#FFFFFF" opacity=".22"/><circle cx="42" cy="92" r="17" fill="#F6A92F"/><circle cx="256" cy="208" r="17" fill="#F6A92F"/><ellipse cx="92" cy="196" rx="15" ry="9" fill="#F2683C" opacity=".34"/><ellipse cx="208" cy="196" rx="15" ry="9" fill="#F2683C" opacity=".34"/><ellipse cx="120" cy="160" rx="29" ry="33" fill="#fff"/><ellipse cx="190" cy="160" rx="29" ry="33" fill="#fff"/><circle cx="127" cy="168" r="15" fill="#045D6D"/><circle cx="183" cy="168" r="15" fill="#045D6D"/><circle cx="122" cy="162" r="6" fill="#fff"/><circle cx="178" cy="162" r="6" fill="#fff"/><path d="M102 130 Q120 122 138 129" stroke="#045D6D" stroke-width="5" stroke-linecap="round" fill="none"/><path d="M172 129 Q190 122 208 130" stroke="#045D6D" stroke-width="5" stroke-linecap="round" fill="none"/><path d="M128 196 Q150 204 172 196 Q167 220 150 222 Q133 220 128 196 Z" fill="#0A3942"/></svg>',
};

// ---------- data load (live, unchanged binding) ----------
async function load(){
  const app = document.getElementById('app');
  try{
    let sid = new URLSearchParams(location.search).get('student');
    if(!sid){
      // CHILD MODE: resolve self from the child cookie (paired device, child logged in)
      const cm = await fetch('/api/child/me');
      if(cm.ok){ CHILD_MODE = true; sid = (await cm.json()).id; }
    }
    if(!sid){
      const r = await fetch('/api/students');                 // guardian preview fallback
      if(r.status===401){ app.innerHTML='<div class="err">سجّل الدخول أولاً.</div>'; return; }
      const kids = await r.json();
      if(!Array.isArray(kids) || !kids.length){ app.innerHTML='<div class="err">لا يوجد أطفال بعد.</div>'; return; }
      sid = kids[0].id;
    }
    SID = sid;
    const r = await fetch(`/api/students/${sid}/adventure`);
    if(r.status===401){ app.innerHTML='<div class="err">سجّل الدخول أولاً.</div>'; return; }
    if(!r.ok){ app.innerHTML='<div class="err">تعذّر تحميل المغامرة.</div>'; return; }
    render(await r.json());
  }catch(e){ app.innerHTML='<div class="err">تعذّر الاتصال بالخادم.</div>'; }
}

// "هيّا نكمل!" → open the current skill in the solver. In child mode the solver resolves
// the child from the cookie (no student id in the URL — child can't address other children).
function go(d){
  const base = CHILD_MODE ? '/?' : `/?student=${SID}&`;
  if(d.needs_diagnostic){ location.href = base + 'diagnostic=1'; return; }
  const cur = d.current;
  if(cur && cur.skill_id){
    location.href = base + `skill=${cur.skill_id}&name=${encodeURIComponent(cur.name)}`;
  }
}

function render(d){
  const init = (d.child.name || '').trim()[0] || '؟';
  let html = '';

  // brand bar
  html += `<div class="brandbar"><span class="logo" data-brand>فيثاغورث</span><span class="tag">موطن التعليم</span></div>`;

  // top bar — name + coins + streak (Hindi numerals)
  html += `<div class="topbar">
      <div style="display:flex;align-items:center;gap:11px;">
        <span class="avatar">${init}</span>
        <div><div class="hello">مرحباً يا بطل</div><div class="who">${d.child.name}</div></div>
      </div>
      <div class="pills">
        <span class="pill">${SVG.coin} ${H(d.coins)}</span>
        <span class="pill">${SVG.flame} ${H(d.streak_days)}</span>
      </div>
    </div>`;

  // big CTA — what to do right now
  if(d.needs_diagnostic){
    html += `<div class="cta"><div class="pi" aria-hidden="true">&pi;</div>
        <div class="lead">${SVG.pin} لنبدأ مغامرتك</div>
        <div class="skill">لنكتشف مستواك أوّلاً!</div>
        <button class="gobtn" onclick='go(${JSON.stringify(d)})'>هيّا نبدأ! ${SVG.playW}</button>
      </div>`;
  } else if(d.current && d.current.skill_id){
    html += `<div class="cta"><div class="pi" aria-hidden="true">&pi;</div>
        <div class="lead">${SVG.pin} محطّتك الآن</div>
        <div class="skill">${ar(d.current.name)}</div>
        <div class="reason">${d.current.reason}</div>
        <button class="gobtn" onclick='go(${JSON.stringify(d)})'>هيّا نُكمل! ${SVG.playW}</button>
      </div>`;
  } else {
    html += `<div class="cta"><div class="pi" aria-hidden="true">&pi;</div>
        <div class="skill">🎉 أتممتَ كل المحطّات!</div>
        <div class="lead" style="margin-top:8px;justify-content:center">واصِل المراجعة لتبقى بطلاً.</div>
      </div>`;
  }

  // journey title
  html += `<div class="jtitle">${SVG.map}<h2>خريطة مغامرتي</h2></div>`;

  // the data-driven trail — every station from the real path, in order
  html += '<div class="trail">';
  const st = d.stations;
  st.forEach((s, i) => {
    const icon = s.visual==='mastered' ? SVG.star
               : s.visual==='current'  ? SVG.playW
               : s.visual==='locked'   ? SVG.lock : SVG.play;
    // connector colouring: a segment is "done" when the station above it is mastered
    const topDone = i>0 && st[i-1].mastered;
    const botDone = s.mastered;
    const connTop = i===0 ? 'conn top up' : (topDone ? 'conn top done' : 'conn top');
    const connBot = 'conn bot' + (botDone ? ' done' : '');
    const namir = s.is_current
      ? `<span class="namir"><span class="bubble">أنا معك!</span>${SVG.namir}</span>` : '';
    html += `<div class="srow">
        <div class="rail"><span class="${connTop}"></span><span class="${connBot}"></span><span class="dot ${s.visual}">${icon}</span></div>
        <div class="lab ${s.visual}"><span class="labcard">${ar(s.name)}</span>${namir}</div>
      </div>`;
  });
  // treasure goal at the very end (decorative — the destination)
  const lastDone = st.length && st[st.length-1].mastered;
  html += `<div class="srow">
      <div class="rail"><span class="conn top${lastDone?' done':''}"></span><span class="conn bot up"></span><span class="dot treasure">${SVG.chest}<span class="twink">${SVG.twinkle}</span></span></div>
      <div class="lab locked"><span class="labcard">كنز الأبطال 🏅</span></div>
    </div>`;
  html += '</div>';

  document.getElementById('app').innerHTML = html;
}
load();
</script>
<script src="/static/site.js"></script>
</body>
</html>
