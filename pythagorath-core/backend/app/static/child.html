<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مغامرتي — فيثاغورث</title>
<!-- brand.css imports the fonts + colour tokens; final look comes from Claude Design later -->
<link rel="stylesheet" href="/static/brand.css">
<style>
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    font-family:'Readex Pro',sans-serif; color:#2C2620; min-height:100vh;
    background:#FBF7F0;
    background-image:
      radial-gradient(58% 30% at 92% 0%,rgba(243,154,31,.12),transparent 60%),
      radial-gradient(54% 28% at 6% 4%,rgba(41,169,224,.12),transparent 60%);
  }
  @keyframes bob{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }
  @keyframes pulse{ 0%,100%{box-shadow:0 0 0 0 rgba(41,169,224,.45)} 50%{box-shadow:0 0 0 14px rgba(41,169,224,0)} }
  .wrap{ max-width:560px; margin:0 auto; padding:22px 18px 60px; }
  .err{ text-align:center; padding:60px 16px; color:#9A8F82; font-size:17px; }

  /* top bar: name + coins + streak (big, kid-friendly) */
  .topbar{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
           background:linear-gradient(135deg,#163E52,#1B6E97 70%,#1E84B6); color:#fff;
           border-radius:24px; padding:16px 18px; box-shadow:0 22px 46px -26px rgba(21,94,125,.7); }
  .topbar .who{ font-family:'Baloo Bhaijaan 2',cursive; font-weight:800; font-size:24px; }
  .pills{ display:flex; gap:8px; }
  .pill{ display:inline-flex; align-items:center; gap:7px; background:rgba(255,255,255,.16);
         border:1px solid rgba(255,255,255,.22); border-radius:999px; padding:8px 14px;
         font-weight:800; font-size:18px; white-space:nowrap; }

  /* big call-to-action: the current skill + the GO button */
  .cta{ background:#fff; border:1px solid #EFE7DA; border-radius:24px; padding:20px; margin:16px 0;
        text-align:center; box-shadow:0 16px 34px -24px rgba(21,94,125,.6); }
  .cta .lead{ color:#8A8178; font-size:15px; margin-bottom:4px; }
  .cta .skill{ font-family:'Baloo Bhaijaan 2',cursive; font-weight:800; font-size:22px; color:#155E7D; line-height:1.4; }
  .cta .reason{ display:inline-block; margin-top:8px; background:#E6F4FB; color:#178FC9;
                border-radius:999px; padding:5px 14px; font-size:14px; font-weight:700; }
  .gobtn{ display:block; width:100%; margin-top:16px; border:0; cursor:pointer;
          font-family:'Baloo Bhaijaan 2',cursive; font-weight:800; font-size:24px; color:#fff;
          background:linear-gradient(135deg,#F39A1F,#E8833A); border-radius:20px; padding:18px 20px;
          box-shadow:0 16px 30px -12px rgba(217,126,10,.7); transition:transform .08s; }
  .gobtn:hover{ transform:translateY(-2px); } .gobtn:active{ transform:translateY(1px); }

  /* mascot placeholder (نُمَيْر) — sits beside the current station */
  .namir{ flex:0 0 auto; width:54px; height:54px; border-radius:50%;
          background:linear-gradient(135deg,#FFE6BE,#F9AC36); color:#7A4A06;
          display:flex; align-items:center; justify-content:center; font-family:'Baloo Bhaijaan 2',cursive;
          font-weight:800; font-size:13px; animation:bob 4s ease-in-out infinite;
          box-shadow:0 10px 20px -10px rgba(217,126,10,.7); }

  /* the station journey (vertical path) */
  .journey{ margin-top:8px; }
  .jtitle{ font-family:'Baloo Bhaijaan 2',cursive; font-weight:800; font-size:18px; color:#155E7D; margin:18px 4px 10px; }
  .station{ display:flex; align-items:center; gap:14px; position:relative; padding:6px 0; }
  .dot{ flex:0 0 auto; width:54px; height:54px; border-radius:50%; display:flex; align-items:center; justify-content:center;
        font-size:24px; border:3px solid transparent; position:relative; z-index:1; }
  /* connector line between stations */
  .station:not(:last-child) .dot::after{ content:""; position:absolute; top:54px; right:50%; transform:translateX(50%);
        width:4px; height:34px; background:#E7E2D8; border-radius:2px; z-index:0; }
  .dot.mastered{ background:linear-gradient(135deg,#FFD27E,#F39A1F); color:#fff; border-color:#E68A0C; }
  .dot.available{ background:#fff; color:#178FC9; border-color:#9FD3EC; }
  .dot.current{ background:linear-gradient(135deg,#37B6E6,#178FC9); color:#fff; border-color:#0E6E9C;
                width:62px; height:62px; font-size:28px; animation:pulse 1.8s ease-out infinite; }
  .station:not(:last-child) .dot.current::after{ top:62px; }
  .dot.locked{ background:#F1ECE3; color:#BBB1A2; border-color:#E0D9CC; }
  .label{ flex:1; font-size:17px; font-weight:700; color:#3A4750; line-height:1.5; }
  .station.lockedrow .label{ color:#A89F92; font-weight:600; }
  .station.currentrow .label{ color:#155E7D; font-weight:800; }
  .frac{ display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle;
         line-height:1; margin:0 4px; font-size:.86em; color:#178FC9; }
  .frac b{ border-bottom:1.7px solid currentColor; padding:0 4px; font-weight:700; }
  .frac i{ padding:0 4px; font-style:normal; }
</style>
</head>
<body>
<div class="wrap" id="app"><div class="err">… جارٍ التحميل</div></div>
<script>
// ---------- mandatory UI helpers ----------
const H = n => String(n).replace(/[0-9]/g, d => '٠١٢٣٤٥٦٧٨٩'[+d]);
function ar(s){
  s = String(s == null ? "" : s);
  s = s.replace(/(\d+)\s*\/\s*(\d+)/g, (m,a,b)=>`<span class="frac"><b>${H(a)}</b><i>${H(b)}</i></span>`);
  return s.replace(/[0-9]/g, d => '٠١٢٣٤٥٦٧٨٩'[+d]);
}

let SID = null;

async function load(){
  const app = document.getElementById('app');
  try{
    let sid = new URLSearchParams(location.search).get('student');
    if(!sid){
      const r = await fetch('/api/students');
      if(r.status===401){ app.innerHTML='<div class="err">سجّل الدخول أولاً.</div>'; return; }
      const kids = await r.json();
      if(!Array.isArray(kids) || !kids.length){ app.innerHTML='<div class="err">لا يوجد أطفال بعد.</div>'; return; }
      sid = kids[0].id;
    }
    SID = sid;
    const r = await fetch(`/api/students/${sid}/adventure`);
    if(r.status===401){ app.innerHTML='<div class="err">سجّل الدخول أولاً.</div>'; return; }
    if(!r.ok){ app.innerHTML='<div class="err">تعذّر تحميل المغامرة.</div>'; return; }
    render(await r.json());
  }catch(e){ app.innerHTML='<div class="err">تعذّر الاتصال بالخادم.</div>'; }
}

// "هيّا نكمل!" → open the current skill directly in the solver (index.html), or the diagnostic
function go(d){
  if(d.needs_diagnostic){ location.href = `/?student=${SID}&diagnostic=1`; return; }
  const cur = d.current;
  if(cur && cur.skill_id){
    location.href = `/?student=${SID}&skill=${cur.skill_id}&name=${encodeURIComponent(cur.name)}`;
  }
}

function render(d){
  let html = '';

  // top bar — name + coins + streak (Hindi numerals)
  html += `<div class="topbar">
      <div class="who">${d.child.name}</div>
      <div class="pills">
        <span class="pill">🪙 ${H(d.coins)}</span>
        <span class="pill">🔥 ${H(d.streak_days)}</span>
      </div>
    </div>`;

  // big CTA — what to do right now
  if(d.needs_diagnostic){
    html += `<div class="cta">
        <div class="lead">لنبدأ مغامرتك</div>
        <div class="skill">لنكتشف مستواك أولاً!</div>
        <button class="gobtn" onclick='go(${JSON.stringify(d)})'>هيّا نبدأ! 🚀</button>
      </div>`;
  } else if(d.current && d.current.skill_id){
    html += `<div class="cta">
        <div class="lead">محطّتك الآن</div>
        <div class="skill">${ar(d.current.name)}</div>
        <div class="reason">${d.current.reason}</div>
        <button class="gobtn" onclick='go(${JSON.stringify(d)})'>هيّا نكمل! ▶</button>
      </div>`;
  } else {
    html += `<div class="cta">
        <div class="skill">🎉 أتممتَ كل المحطّات!</div>
        <div class="lead" style="margin-top:8px">واصِل المراجعة لتبقى بطلاً.</div>
      </div>`;
  }

  // the station journey — the child's path in order, with visual state
  html += '<div class="journey"><div class="jtitle">🗺️ خريطة مغامرتي</div>';
  for(const s of d.stations){
    const icon = s.visual==='mastered' ? '🏆'
               : s.visual==='current'  ? '⭐'
               : s.visual==='locked'   ? '🔒' : '◉';
    const namir = s.is_current
      ? `<span class="namir" title="نُمَيْر">نُمَيْر</span>` : '';
    const rowcls = s.visual==='current' ? ' currentrow' : (s.visual==='locked' ? ' lockedrow' : '');
    html += `<div class="station${rowcls}">
        <span class="dot ${s.visual}">${icon}</span>
        <span class="label">${ar(s.name)}</span>
        ${namir}
      </div>`;
  }
  html += '</div>';

  document.getElementById('app').innerHTML = html;
}
load();
</script>
</body>
</html>
