<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة الإدارة — فيثاغورث</title>
<link rel="stylesheet" href="/static/brand.css">
<style>
  *{ box-sizing:border-box; }
  html,body{ margin:0; }
  body{ font-family:'Readex Pro',sans-serif; color:#2C2620; background:#F6F4EF; min-height:100vh; }
  a{ color:inherit; }
  .gate{ max-width:380px; margin:12vh auto; background:#fff; border:1px solid #EFE7DA; border-radius:18px; padding:26px; box-shadow:0 18px 36px -24px rgba(21,94,125,.5); }
  .gate h1{ font-family:'Baloo Bhaijaan 2',cursive; color:#155E7D; font-size:22px; margin:0 0 6px; }
  .gate p{ color:#8A8178; font-size:14px; margin:0 0 14px; }
  .gate input{ width:100%; margin:6px 0; padding:11px 13px; border:1.5px solid #E3DACB; border-radius:12px; font-family:inherit; font-size:15px; }
  .gate button{ width:100%; margin-top:8px; border:0; border-radius:13px; padding:12px; cursor:pointer; font-family:'Baloo Bhaijaan 2',cursive; font-weight:800; font-size:16px; color:#fff; background:linear-gradient(135deg,#163E52,#1B6E97); }
  .gate .err{ color:#C0392B; font-size:13px; min-height:18px; }

  .shell{ display:flex; min-height:100vh; }
  .side{ flex:0 0 232px; background:linear-gradient(180deg,#163E52,#114457); color:#fff; padding:18px 14px; position:sticky; top:0; height:100vh; overflow:auto; }
  .brand{ font-family:'Baloo Bhaijaan 2',cursive; font-weight:800; font-size:20px; margin:4px 8px 4px; }
  .brand .sub{ display:block; font-size:12px; color:rgba(255,255,255,.6); font-weight:400; font-family:'Readex Pro',sans-serif; }
  .navgrp .lbl{ font-size:11.5px; color:rgba(255,255,255,.5); margin:14px 10px 6px; font-weight:700; }
  .nav{ display:flex; align-items:center; gap:9px; width:100%; text-align:right; background:none; border:0; color:rgba(255,255,255,.86);
        font-family:'Readex Pro',sans-serif; font-size:14.5px; font-weight:600; padding:10px 11px; border-radius:11px; cursor:pointer; }
  .nav:hover{ background:rgba(255,255,255,.08); } .nav.active{ background:rgba(255,255,255,.16); color:#fff; }
  .nav .ic{ width:18px; text-align:center; }
  .nav .soon{ margin-inline-start:auto; font-size:10.5px; background:rgba(255,255,255,.18); border-radius:999px; padding:2px 7px; }

  .wrap{ flex:1; display:flex; flex-direction:column; min-width:0; }
  /* topbar */
  .topbar{ position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:14px; background:#fff; border-bottom:1px solid #EAE2D4; padding:11px 22px; }
  .gsearch{ position:relative; flex:1; max-width:420px; }
  .gsearch input{ width:100%; padding:9px 14px; border:1.5px solid #E3DACB; border-radius:999px; font-family:inherit; font-size:14px; background:#FBF9F4; }
  .gres{ position:absolute; top:44px; right:0; left:0; background:#fff; border:1px solid #EAE2D4; border-radius:14px; box-shadow:0 18px 40px -20px rgba(21,94,125,.5); overflow:hidden; display:none; z-index:40; }
  .gres.show{ display:block; } .gres .gi{ padding:9px 14px; cursor:pointer; font-size:14px; display:flex; gap:8px; align-items:center; } .gres .gi:hover{ background:#FBF7F0; }
  .gres .gt{ font-size:11px; color:#9A8F82; padding:7px 14px 3px; }
  .spacer{ flex:1; }
  .hbtn{ position:relative; background:#F4F1EA; border:1px solid #EAE2D4; border-radius:12px; padding:8px 11px; cursor:pointer; font-size:16px; }
  .badge{ position:absolute; top:-6px; left:-6px; background:#E2654E; color:#fff; border-radius:999px; font-size:10.5px; font-weight:800; min-width:18px; height:18px; display:flex; align-items:center; justify-content:center; padding:0 4px; }
  .prof{ display:flex; align-items:center; gap:9px; background:#F4F1EA; border:1px solid #EAE2D4; border-radius:12px; padding:6px 11px 6px 9px; cursor:pointer; }
  .av{ width:30px; height:30px; border-radius:50%; background:linear-gradient(135deg,#163E52,#1B6E97); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-family:'Baloo Bhaijaan 2',cursive; }
  .prof .em{ font-size:13px; color:#5A5249; max-width:170px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .drop{ position:absolute; top:50px; left:22px; min-width:230px; background:#fff; border:1px solid #EAE2D4; border-radius:14px; box-shadow:0 18px 40px -20px rgba(21,94,125,.5); overflow:hidden; display:none; z-index:40; }
  .drop.show{ display:block; } .drop .di{ padding:11px 15px; cursor:pointer; font-size:14px; display:flex; gap:9px; align-items:flex-start; } .drop .di:hover{ background:#FBF7F0; }
  .drop .dh{ padding:10px 15px; font-size:12px; color:#9A8F82; border-bottom:1px solid #F0EADF; } .drop .empty{ padding:16px 15px; color:#9A8F82; font-size:13.5px; }

  .main{ padding:24px 26px 60px; max-width:1100px; }
  h2.sec{ font-family:'Baloo Bhaijaan 2',cursive; font-size:22px; color:#155E7D; margin:0 0 4px; }
  .muted{ color:#8A8178; font-size:14px; }
  .cards{ display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:14px; margin:16px 0; }
  .stat{ background:#fff; border:1px solid #EFE7DA; border-radius:16px; padding:16px 18px; box-shadow:0 12px 26px -22px rgba(21,94,125,.6); }
  .stat .big{ font-family:'Baloo Bhaijaan 2',cursive; font-weight:800; font-size:30px; color:#155E7D; }
  .stat.orange .big{ color:#D97E0A; } .stat.green .big{ color:#1E945B; } .stat.cyan .big{ color:#178FC9; } .stat.live .big{ color:#7A4FB0; }
  .stat .lbl{ color:#8A8178; font-size:13px; margin-top:3px; } .stat .hint{ color:#A89F92; font-size:11.5px; margin-top:2px; }
  .panel{ background:#fff; border:1px solid #EFE7DA; border-radius:16px; padding:18px; margin:14px 0; box-shadow:0 12px 26px -22px rgba(21,94,125,.55); }
  .panel h3{ font-family:'Baloo Bhaijaan 2',cursive; font-size:16px; color:#1B6E45; margin:0 0 12px; }
  .note{ background:#F3EEFA; border:1px solid #E0D3F2; border-radius:12px; padding:11px 14px; color:#5B3FB0; font-size:13.5px; margin:10px 0; }
  .bars{ display:flex; align-items:flex-end; gap:10px; height:120px; padding-top:8px; }
  .bar{ flex:1; display:flex; flex-direction:column; align-items:center; gap:5px; height:100%; justify-content:flex-end; }
  .bar .col{ width:70%; min-height:3px; background:linear-gradient(180deg,#37B6E6,#178FC9); border-radius:6px 6px 0 0; }
  .bar .n{ font-size:12px; font-weight:800; color:#155E7D; } .bar .d{ font-size:11px; color:#9A8F82; }
  table{ width:100%; border-collapse:collapse; font-size:14px; }
  th,td{ text-align:right; padding:9px 10px; border-bottom:1px solid #F0EADF; }
  th.s{ cursor:pointer; user-select:none; } th.s:hover{ color:#155E7D; }
  th{ color:#8A8178; font-size:12.5px; font-weight:700; }
  tr.clickable{ cursor:pointer; } tr.clickable:hover{ background:#FBF7F0; }
  .pill{ display:inline-block; border-radius:999px; padding:2px 10px; font-size:12px; font-weight:700; }
  .pill.ok{ background:#E8F7EE; color:#1E945B; } .pill.warn{ background:#FFF1DA; color:#D97E0A; } .pill.gray{ background:#EEF1F4; color:#7C8893; }
  .tctrl{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:10px; }
  .tctrl input, .tctrl select{ padding:8px 12px; border:1.5px solid #E3DACB; border-radius:11px; font-family:inherit; font-size:13.5px; background:#fff; }
  .tctrl input.q{ min-width:200px; flex:1; max-width:280px; }
  .exp{ background:#E8F7EE; color:#1E945B; border:1px solid #BFE6CB; border-radius:11px; padding:8px 14px; cursor:pointer; font-weight:700; font-size:13.5px; margin-inline-start:auto; }
  .pager{ display:flex; gap:8px; align-items:center; justify-content:center; margin-top:12px; color:#5A5249; font-size:13.5px; }
  .pager button{ background:#F4F1EA; border:1px solid #E3DACB; border-radius:9px; padding:6px 12px; cursor:pointer; font-family:inherit; } .pager button:disabled{ opacity:.45; cursor:default; }
  .emptyst{ text-align:center; padding:40px 16px; color:#9A8F82; } .emptyst .em{ font-size:34px; }
  .linkbtn{ display:inline-block; background:#E6F4FB; color:#178FC9; border:0; border-radius:999px; padding:8px 15px; font-weight:700; font-size:13.5px; cursor:pointer; text-decoration:none; }
  .soonbox{ text-align:center; padding:48px 16px; color:#8A8178; } .soonbox .em{ font-size:40px; } .soonbox h3{ font-family:'Baloo Bhaijaan 2',cursive; color:#155E7D; font-size:20px; margin:10px 0 4px; }
  .frow{ margin:9px 0; } .frow label{ display:block; font-size:13px; color:#5A5249; margin-bottom:4px; font-weight:600; }
  .frow input, .frow textarea, .frow select{ width:100%; max-width:380px; padding:9px 12px; border:1.5px solid #E3DACB; border-radius:11px; font-family:inherit; font-size:14px; }
  .frow input[type=color]{ width:60px; height:38px; padding:2px; } .frow input[type=checkbox]{ width:auto; }
  .savebtn{ margin-top:10px; background:linear-gradient(135deg,#163E52,#1B6E97); color:#fff; border:0; border-radius:12px; padding:10px 22px; font-family:'Baloo Bhaijaan 2',cursive; font-weight:800; cursor:pointer; }
  .okmsg{ color:#1E945B; font-weight:700; margin-inline-start:10px; }
  .err{ color:#C0392B; }
  .tabs{ display:flex; gap:8px; flex-wrap:wrap; }
  .tabs button{ background:#F1EBE0; border:0; border-radius:11px; padding:8px 16px; cursor:pointer; font-family:inherit; font-weight:700; color:#7C6F5E; }
  .tabs button.on{ background:#155E7D; color:#fff; }
  .modal{ position:fixed; inset:0; background:rgba(18,42,54,.45); display:none; align-items:center; justify-content:center; padding:20px; z-index:60; }
  .modal.show{ display:flex; }
  .modal .box{ background:#fff; border-radius:18px; max-width:520px; width:100%; max-height:86vh; overflow:auto; padding:22px; }
  .modal h3{ font-family:'Baloo Bhaijaan 2',cursive; color:#155E7D; margin:0 0 8px; }
  .x{ float:left; cursor:pointer; color:#9A8F82; border:0; background:none; font-size:20px; }
</style>
</head>
<body>
<div id="app"><div class="gate"><p>… جارٍ التحميل</p></div></div>
<script>
const H = n => String(n==null?'':n).replace(/[0-9]/g, d => '٠١٢٣٤٥٦٧٨٩'[+d]);
const CO = {SA:'السعودية',QA:'قطر',BH:'البحرين',KW:'الكويت',OM:'عُمان',AE:'الإمارات'};
const day = s => s ? H(String(s).slice(0,10)) : '—';
async function api(path, opts){
  const r = await fetch(path, opts);
  if(!r.ok){ const e=new Error('حدث خطأ'); e.status=r.status; try{e.detail=(await r.json()).detail;}catch(_){} throw e; }
  return r.status===204 ? null : r.json();
}
let ME=null, OV=null, STUDENTS=[], PARENTS=[], NODES=null, NOTIFS=[], CURRENT='overview', STUDENT_FILTER=null;

const SECTIONS = [
  {grp:'الإدارة', items:[{id:'overview',ic:'🏠',name:'الرئيسية'},{id:'students',ic:'🧒',name:'الطلّاب'},{id:'parents',ic:'👪',name:'أولياء الأمور'}]},
  {grp:'المحتوى والجودة', items:[{id:'questions',ic:'❓',name:'الأسئلة'},{id:'skills',ic:'🗂️',name:'المهارات'},{id:'reports',ic:'📊',name:'التقارير'}]},
  {grp:'التحكّم بالمنصّة', items:[{id:'integrations',ic:'🔌',name:'التكاملات'},{id:'ads',ic:'📣',name:'الإعلانات'},{id:'countries',ic:'🌍',name:'الدول / المناهج'}]},
  {grp:'الاشتراك والتسعير', items:[{id:'pricing',ic:'💳',name:'التسعير والخطط'},{id:'paymethods',ic:'🏦',name:'طرق الدفع'},{id:'receipts',ic:'🧾',name:'الإيصالات'},{id:'subs',ic:'🔁',name:'الاشتراكات'}]},
  {grp:'', items:[{id:'settings',ic:'⚙️',name:'الإعدادات'}]},
];

async function boot(){
  try{ ME = await api('/api/auth/me'); }catch(e){ return showGate(); }
  if(ME.role !== 'admin'){ return showForbidden(ME.email); }
  try{ [OV, STUDENTS, PARENTS] = await Promise.all([api('/api/admin/overview'), api('/api/admin/students'), api('/api/admin/parents')]); }
  catch(e){ STUDENTS=STUDENTS||[]; PARENTS=PARENTS||[]; }
  buildNotifs();
  renderShell();
  go('overview');
}
function showGate(){ document.getElementById('app').innerHTML = `<div class="gate"><h1>لوحة الإدارة</h1><p>هذه اللوحة للمالك فقط. سجّل الدخول.</p>
  <input id="ge" type="email" placeholder="البريد"><input id="gp" type="password" placeholder="كلمة السر"><div class="err" id="gerr"></div>
  <button onclick="doLogin()">دخول</button>
  <div style="text-align:center;margin-top:12px"><a onclick="showResetReq()" style="cursor:pointer;color:#178FC9;font-size:13.5px">نسيت كلمة السر؟</a></div></div>`; }

// ---- استعادة كلمة سر المالك (يستعمل نفس آلية password-reset القائمة — المالك مستخدم بدور admin) ----
function showResetReq(){ document.getElementById('app').innerHTML = `<div class="gate"><h1>نسيت كلمة السر؟</h1>
  <p>أدخل بريد المالك، وسنرسل رمز إعادة التعيين.</p>
  <input id="re" type="email" placeholder="البريد"><div class="err" id="rerr"></div>
  <button onclick="reqReset()">أرسل الرمز</button>
  <div style="text-align:center;margin-top:12px"><a onclick="showGate()" style="cursor:pointer;color:#178FC9;font-size:13.5px">رجوع للدخول</a></div>
  <p style="font-size:12px;color:#8A8178;margin:12px 0 0;text-align:center">إن لم يُضبط بريد الخادم (SMTP)، يُطبع الرمز في سجلّ الخادم (وضع التطوير).</p></div>`; }
function showResetConfirm(){ document.getElementById('app').innerHTML = `<div class="gate"><h1>تعيين كلمة سر جديدة</h1>
  <p>أدخل الرمز الذي وصل بريدك وكلمة السر الجديدة.</p>
  <input id="rtok" placeholder="الرمز من البريد"><input id="rpw" type="password" placeholder="كلمة السر الجديدة (٨ أحرف على الأقل)">
  <div class="err" id="rerr2"></div>
  <button onclick="confirmReset()">تعيين كلمة السر</button>
  <div style="text-align:center;margin-top:12px"><a onclick="showGate()" style="cursor:pointer;color:#178FC9;font-size:13.5px">رجوع للدخول</a></div></div>`; }
async function reqReset(){ const err=document.getElementById('rerr'); err.textContent='';
  const email=document.getElementById('re').value.trim(); if(!email){ err.textContent='أدخل بريدك.'; return; }
  try{ await api('/api/auth/password-reset/request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})}); }
  catch(e){}                              // always proceed (no account enumeration)
  showResetConfirm(); }
async function confirmReset(){ const err=document.getElementById('rerr2'); err.textContent='';
  const token=document.getElementById('rtok').value.trim(), new_password=document.getElementById('rpw').value;
  if(!token){ err.textContent='أدخل الرمز.'; return; }
  if((new_password||'').length<8){ err.textContent='كلمة السر ٨ أحرف على الأقل.'; return; }
  try{ await api('/api/auth/password-reset/confirm',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,new_password})});
    showGate(); const g=document.getElementById('gerr'); if(g){ g.style.color='#1E945B'; g.textContent='تم تغيير كلمة السر — سجّل الدخول.'; }
  }catch(e){ err.textContent = e.detail || 'الرمز غير صالح أو منتهٍ.'; } }
function showForbidden(email){ document.getElementById('app').innerHTML = `<div class="gate"><h1>غير مصرَّح</h1><p>الحساب «${email||''}» ليس مالكاً. هذه اللوحة للمالك فقط.</p><button onclick="logout()">تسجيل الخروج</button></div>`; }
async function doLogin(){ const email=document.getElementById('ge').value.trim(), password=document.getElementById('gp').value;
  try{ await api('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})}); boot(); }
  catch(e){ document.getElementById('gerr').textContent = e.detail || 'بريد أو كلمة سر غير صحيحة'; } }
async function logout(){ try{ await api('/api/auth/logout',{method:'POST'}); }catch(e){} location.reload(); }

function buildNotifs(){
  NOTIFS=[];
  const nr = OV && OV.content_health ? OV.content_health.needs_review : 0;
  if(nr>0) NOTIFS.push({txt:`${H(nr)} سؤال بحاجة مراجعة`, act:()=>go('questions')});
  const undiag = STUDENTS.filter(s=>!s.diagnosed).length;
  if(undiag>0) NOTIFS.push({txt:`${H(undiag)} طفل لم يُشخَّص بعد`, act:()=>{ STUDENT_FILTER={status:'undiagnosed'}; go('students'); }});
  const stuck = (OV && OV.struggled || []).filter(r=>r.stuck>0);
  if(stuck.length) NOTIFS.push({txt:`تعثّر مرتفع: ${stuck[0].name}`, act:()=>go('reports')});
}

function renderShell(){
  let nav='';
  for(const g of SECTIONS){ if(g.grp) nav+=`<div class="lbl">${g.grp}</div>`;
    for(const it of g.items) nav+=`<button class="nav" data-id="${it.id}" onclick="go('${it.id}')"><span class="ic">${it.ic}</span>${it.name}${it.soon?'<span class="soon">قريباً</span>':''}</button>`; }
  const initial = (ME.email||'؟').trim()[0].toUpperCase();
  document.getElementById('app').innerHTML = `<div class="shell">
    <aside class="side"><div class="brand">فيثاغورث<span class="sub">لوحة الإدارة</span></div><div class="navgrp">${nav}</div></aside>
    <div class="wrap">
      <div class="topbar">
        <div class="gsearch"><input placeholder="بحث عامّ (طالب أو وليّ أمر)…" oninput="gsearch(this.value)" onfocus="gsearch(this.value)"><div class="gres" id="gres"></div></div>
        <div class="spacer"></div>
        <button class="hbtn" onclick="toggle('ndrop',event)">🔔${NOTIFS.length?`<span class="badge">${H(NOTIFS.length)}</span>`:''}</button>
        <div class="prof" onclick="toggle('pdrop',event)"><span class="av">${initial}</span><span class="em">${ME.email}</span><span>▾</span></div>
        <div class="drop" id="ndrop" style="left:64px"><div class="dh">الإشعارات</div>${NOTIFS.length?NOTIFS.map((n,i)=>`<div class="di" onclick="notif(${i})">🔸 ${n.txt}</div>`).join(''):'<div class="empty">لا إشعارات الآن 🌿</div>'}</div>
        <div class="drop" id="pdrop"><div class="dh">${ME.email}</div><div class="di" onclick="closeDrops();go('settings')">⚙️ الإعدادات</div><div class="di" onclick="logout()">🚪 تسجيل الخروج</div></div>
      </div>
      <main class="main" id="content"></main>
    </div>
    <div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="box" id="modalBox"></div></div>
  </div>`;
  document.addEventListener('click', ()=>closeDrops());
}
function toggle(id,ev){ ev.stopPropagation(); const el=document.getElementById(id); const open=el.classList.contains('show'); closeDrops(); if(!open) el.classList.add('show'); }
function closeDrops(){ document.querySelectorAll('.drop,.gres').forEach(d=>d.classList.remove('show')); }
function notif(i){ closeDrops(); NOTIFS[i].act(); }

function gsearch(q){
  const box=document.getElementById('gres'); q=(q||'').trim();
  if(!q){ box.classList.remove('show'); return; }
  const st=STUDENTS.filter(s=>(s.name||'').includes(q)).slice(0,5);
  const pa=PARENTS.filter(p=>(p.email||'').includes(q)).slice(0,5);
  if(!st.length && !pa.length){ box.innerHTML='<div class="empty" style="padding:14px">لا نتائج</div>'; box.classList.add('show'); return; }
  box.innerHTML = (st.length?'<div class="gt">طلّاب</div>'+st.map(s=>`<div class="gi" onclick="closeDrops();studentDetail(${s.id})">🧒 ${s.name} <span class="muted">· ${s.grade||''}</span></div>`).join(''):'')
    + (pa.length?'<div class="gt">أولياء الأمور</div>'+pa.map(p=>`<div class="gi" onclick="closeDrops();go('parents')">👪 ${p.email}</div>`).join(''):'');
  box.classList.add('show');
}

function go(id){
  CURRENT=id; closeDrops();
  document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active', b.dataset.id===id));
  const c=document.getElementById('content'); c.innerHTML='<p class="muted">… جارٍ التحميل</p>';
  ({overview:secOverview,students:secStudents,parents:secParents,questions:secQuestions,skills:secSkills,reports:secReports,integrations:secIntegrations,ads:secAds,countries:secCountries,pricing:secPricing,paymethods:secPayMethods,receipts:secReceipts,subs:secSubs,settings:secSettings}[id])(c);
}
function closeModal(){ document.getElementById('modal').classList.remove('show'); }
function modal(html){ document.getElementById('modalBox').innerHTML=`<button class="x" onclick="closeModal()">✕</button>`+html; document.getElementById('modal').classList.add('show'); }
const stat=(cls,n,lbl,hint)=>`<div class="stat ${cls}"><div class="big">${H(n)}</div><div class="lbl">${lbl}</div>${hint?`<div class="hint">${hint}</div>`:''}</div>`;

// ============ reusable table (search / filter / sort / paginate / CSV / empty) ============
const TBL={};
function makeTable(id, cfg){
  TBL[id]={cfg, st:{q:'',sort:cfg.sort0||null,dir:1,page:1,filters:{}}};
  let f='';
  for(const fl of (cfg.filters||[])) f+=`<select onchange="tblF('${id}','${fl.id}',this.value)"><option value="">${fl.label}</option>${fl.options.map(o=>`<option value="${o.v}">${o.label}</option>`).join('')}</select>`;
  return `<div class="tctrl">
      <input class="q" placeholder="بحث…" oninput="tblQ('${id}',this.value)">
      ${f}<button class="exp" onclick="tblExport('${id}')">⬇ تصدير CSV</button>
    </div><div id="${id}-wrap"></div>`;
}
function tblRows(id){ const {cfg,st}=TBL[id]; let rows=cfg.rows.slice();
  for(const fl of (cfg.filters||[])){ const v=st.filters[fl.id]; if(v) rows=rows.filter(r=>fl.test(r,v)); }
  if(st.q){ rows=rows.filter(r=>cfg.search(r, st.q)); }
  if(st.sort){ const col=cfg.columns.find(c=>c.key===st.sort); if(col){ rows.sort((a,b)=>{ const va=col.sortVal?col.sortVal(a):'', vb=col.sortVal?col.sortVal(b):''; return (va>vb?1:va<vb?-1:0)*st.dir; }); } }
  return rows;
}
function drawBody(id){ const {cfg,st}=TBL[id]; const all=tblRows(id); const ps=cfg.pageSize||15;
  const pages=Math.max(1,Math.ceil(all.length/ps)); if(st.page>pages) st.page=pages;
  const rows=all.slice((st.page-1)*ps, (st.page-1)*ps+ps);
  const wrap=document.getElementById(id+'-wrap');
  if(!all.length){ wrap.innerHTML=`<div class="emptyst"><div class="em">🗃️</div>${cfg.empty||'لا نتائج.'}</div>`; return; }
  const head=cfg.columns.map(c=>`<th class="${c.sortVal?'s':''}" ${c.sortVal?`onclick="tblSort('${id}','${c.key}')"`:''}>${c.label}${st.sort===c.key?(st.dir>0?' ▲':' ▼'):''}</th>`).join('');
  const body=rows.map(r=>`<tr class="${cfg.onRow?'clickable':''}" ${cfg.onRow?`onclick="${cfg.onRow}(${r[cfg.idKey]})"`:''}>${cfg.columns.map(c=>`<td>${c.cell(r)}</td>`).join('')}</tr>`).join('');
  let pager=''; if(pages>1){ pager=`<div class="pager"><button onclick="tblPage('${id}',-1)" ${st.page<=1?'disabled':''}>السابق</button>
    <span>صفحة ${H(st.page)} من ${H(pages)} · ${H(all.length)} نتيجة</span>
    <button onclick="tblPage('${id}',1)" ${st.page>=pages?'disabled':''}>التالي</button></div>`; }
  wrap.innerHTML = `<div class="panel" style="padding:8px 14px"><table><tr>${head}</tr>${body}</table></div>${pager}`;
}
function tblQ(id,v){ TBL[id].st.q=v; TBL[id].st.page=1; drawBody(id); }
function tblF(id,fid,v){ TBL[id].st.filters[fid]=v; TBL[id].st.page=1; drawBody(id); }
function tblSort(id,key){ const st=TBL[id].st; if(st.sort===key) st.dir*=-1; else { st.sort=key; st.dir=1; } drawBody(id); }
function tblPage(id,d){ TBL[id].st.page+=d; drawBody(id); }
function tblExport(id){ const {cfg}=TBL[id]; const rows=tblRows(id);
  const head=cfg.columns.map(c=>c.label); const lines=[head.join(',')];
  for(const r of rows){ lines.push(cfg.columns.map(c=>{ let v=c.csv?c.csv(r):(c.sortVal?c.sortVal(r):''); v=String(v==null?'':v).replace(/"/g,'""'); return /[",\n]/.test(v)?`"${v}"`:v; }).join(',')); }
  const blob=new Blob(['﻿'+lines.join('\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=(cfg.exportName||'export')+'.csv'; a.click(); URL.revokeObjectURL(a.href);
}

  try{ await api('/api/admin/announcements',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}); go('ads'); }
  catch(e){ alert(e.detail||'تعذّر النشر'); } }
function adsTable(ads){
  if(!ads.length) return '<div class="emptyst"><div class="em">📣</div>لا إعلانات بعد.</div>';
  const TT={all:'الكل',unsubscribed:'غير المشتركين',grade:'صف',country:'دولة'};
  return `<table><tr><th>العنوان</th><th>الشكل</th><th>الاستهداف</th><th>الحالة</th><th></th></tr>${
    ads.map(a=>`<tr><td>${a.title}</td><td>${a.format==='popup'?'منبثقة':'شريط'}</td>
      <td>${TT[a.target_type]}${a.target_value?(' · '+(CO[a.target_value]||a.target_value)):''}</td>
      <td>${a.active?'<span class="pill ok">فعّال</span>':'<span class="pill gray">موقوف</span>'}</td>
      <td><button class="linkbtn" onclick="toggleAd(${a.id},${a.active?'false':'true'})">${a.active?'إيقاف':'تفعيل'}</button>
        <button class="linkbtn" style="background:#FBEAE4;color:#B53B27" onclick="delAd(${a.id})">حذف</button></td></tr>`).join('')}</table>`;
}
async function toggleAd(id,active){ try{ await api(`/api/admin/announcements/${id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({active})}); go('ads'); }catch(e){ alert('تعذّر'); } }
async function delAd(id){ if(!confirm('حذف الإعلان؟')) return; try{ await api(`/api/admin/announcements/${id}`,{method:'DELETE'}); go('ads'); }catch(e){ alert('تعذّر'); } }

// ---------- الإعدادات (هوية + واتساب + سمة العرض) ----------
const BRAND_DEFAULT={primary:'#155E7D',secondary:'#F39A1F'};
let PENDING_LOGO=null;
async function secSettings(c){
  let s={}, t='mutadarrij';
  try{ s=await api('/api/admin/settings'); }catch(e){}
  try{ t=(await api('/api/admin/theme')).theme; }catch(e){}
  PENDING_LOGO=null;
  c.innerHTML = `<h2 class="sec">الإعدادات</h2>
    <div class="panel"><h3>هوية المنصّة</h3>
      <div class="frow"><label>اسم المنصّة</label><input id="bname" value="${s.brand_name||''}" placeholder="فيثاغورث"></div>
      <div class="frow"><label>الشعار (صورة صغيرة)</label><input type="file" accept="image/*" onchange="readLogo(this)">
        <div id="logoPrev">${s.brand_logo?`<img src="${s.brand_logo}" style="height:36px;margin-top:6px;vertical-align:middle"> <button class="linkbtn" onclick="clearLogo()">إزالة</button>`:'<span class="muted">لا شعار — يُعرض اسم المنصّة نصّاً.</span>'}</div></div>
      <div class="row2">
        <div class="frow"><label>اللون الأساسي</label><input type="color" id="bp" value="${s.brand_primary||BRAND_DEFAULT.primary}"></div>
        <div class="frow"><label>اللون الثانوي</label><input type="color" id="bs" value="${s.brand_secondary||BRAND_DEFAULT.secondary}"></div>
      </div>
      <button class="savebtn" onclick="saveBrand()">حفظ الهوية</button>
      <button class="linkbtn" onclick="resetBrand()">إرجاع للافتراضي</button>
      <span id="brand-msg" class="okmsg"></span>
      <div class="muted" style="margin-top:6px">الافتراضي محفوظ — يمكنك الرجوع إليه في أي وقت.</div>
    </div>
    <div class="panel"><h3>زرّ واتساب للدعم</h3>
      <div class="frow"><label>الرقم (دوليّ بلا +)</label><input id="wnum" value="${s.whatsapp_number||''}" placeholder="٩٦٦٥XXXXXXXX"></div>
      <div class="frow"><label><input type="checkbox" id="wen" ${s.whatsapp_enabled==='1'?'checked':''}> إظهار زرّ واتساب للعملاء</label></div>
      <button class="savebtn" onclick="saveSettings({whatsapp_number:val('wnum'),whatsapp_enabled:document.getElementById('wen').checked?'1':'0'},'wa')">حفظ</button>
      <span id="wa-msg" class="okmsg"></span>
    </div>
    <div class="panel"><h3>فيديو «كيف يعمل» (صفحة الهبوط)</h3>
      <div class="frow"><label>رابط الفيديو أو مسار ملفّ مرفوع</label><input id="hvid" value="${s.how_video_url||''}" placeholder="https://youtu.be/… أو /static/assets/how-it-works.mp4"></div>
      <div class="muted">يظهر في «شاهد كيف تعمل» على الهبوط. اتركه فارغاً ليظهر الشرح المتحرّك بدلاً منه. يدعم يوتيوب/فيميو أو ملفّ MP4 مباشر.</div>
      <button class="savebtn" onclick="saveSettings({how_video_url:val('hvid')},'hv')">حفظ الفيديو</button>
      <span id="hv-msg" class="okmsg"></span>
    </div>
    <div class="panel"><h3>سمة العرض</h3><div class="tctrl">
      ${['mutadarrij','ameen','mutawwar'].map(x=>`<button class="linkbtn" style="${x===t?'background:#155E7D;color:#fff':''}" onclick="setTheme('${x}')">${({mutadarrij:'متدرّج',ameen:'أمين',mutawwar:'مطوّر'})[x]}</button>`).join('')}
    </div></div>`;
}
function readLogo(inp){ const f=inp.files[0]; if(!f) return;
  if(f.size>400000){ alert('الصورة كبيرة — استخدم شعاراً صغيراً (أقل من ٤٠٠ ك.ب).'); inp.value=''; return; }
  const r=new FileReader(); r.onload=()=>{ PENDING_LOGO=r.result; document.getElementById('logoPrev').innerHTML=`<img src="${r.result}" style="height:36px;margin-top:6px;vertical-align:middle"> <span class="muted">(غير محفوظ بعد)</span>`; }; r.readAsDataURL(f); }
function clearLogo(){ PENDING_LOGO=''; document.getElementById('logoPrev').innerHTML='<span class="muted">سيُزال عند الحفظ.</span>'; }
async function saveBrand(){ const obj={brand_name:val('bname'),brand_primary:document.getElementById('bp').value,brand_secondary:document.getElementById('bs').value};
  if(PENDING_LOGO!==null) obj.brand_logo=PENDING_LOGO; await saveSettings(obj,'brand'); PENDING_LOGO=null; }
async function resetBrand(){ if(!confirm('إرجاع الاسم/الشعار/الألوان للافتراضي؟')) return;
  try{ await api('/api/admin/settings',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({brand_name:'',brand_logo:'',brand_primary:'',brand_secondary:''})}); go('settings'); }catch(e){ alert('تعذّر'); } }
async function setTheme(x){ try{ await api('/api/admin/theme',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({theme:x})}); go('settings'); }catch(e){ alert('تعذّر'); } }

// ---------- التسعير والخطط (مُدار من اللوحة) ----------
const omr = b => H((Number(b||0)/1000).toFixed(3)) + ' ر.ع.';
const PERIOD = {monthly:'شهري', yearly:'سنوي'};
let PLAN_EDIT = null;
async function secPricing(c){
  let plans; try{ plans=await api('/api/admin/plans'); }catch(e){ c.innerHTML='<p class="err">تعذّر التحميل</p>'; return; }
  const e = PLAN_EDIT ? plans.find(p=>p.id===PLAN_EDIT) : null;
  c.innerHTML = `<h2 class="sec">التسعير والخطط</h2>
    <div class="muted">خطط أسرية متدرّجة — المالك يحدّد الأسعار والحدود والتجربة (لا ثوابت في الكود). العملة: ر.ع.</div>
    <div class="panel"><h3>${e?'تعديل خطّة':'خطّة جديدة'}</h3>
      <div class="frow"><label>الاسم</label><input id="pl_name" value="${e?e.name:''}" placeholder="عائلية (حتى ٣)"></div>
      <div class="row2">
        <div class="frow"><label>السعر (ر.ع.)</label><input id="pl_price" type="number" step="0.001" min="0" value="${e?(e.price/1000):''}" placeholder="٣٫٠٠٠"></div>
        <div class="frow"><label>الدورة</label><select id="pl_period"><option value="monthly" ${e&&e.period==='monthly'?'selected':''}>شهري</option><option value="yearly" ${e&&e.period==='yearly'?'selected':''}>سنوي</option></select></div>
      </div>
      <div class="row2">
        <div class="frow"><label>حدّ الأطفال</label><input id="pl_max" type="number" min="1" value="${e?e.max_children:1}"></div>
        <div class="frow"><label>أيام التجربة</label><input id="pl_trial" type="number" min="0" value="${e?e.trial_days:0}"></div>
      </div>
      <div class="frow"><label><input type="checkbox" id="pl_active" ${!e||e.is_active?'checked':''}> مفعّلة (تظهر للعملاء)</label></div>
      <button class="savebtn" onclick="savePlan(${e?e.id:'null'})">${e?'حفظ التعديل':'إنشاء الخطّة'}</button>
      ${e?`<button class="linkbtn" onclick="PLAN_EDIT=null;go('pricing')">إلغاء</button>`:''}
    </div>
    <div class="panel"><h3>الخطط الحالية</h3>${plans.length?`<table>
      <tr><th>الاسم</th><th>السعر</th><th>الدورة</th><th>حدّ الأطفال</th><th>تجربة</th><th>الحالة</th><th></th></tr>
      ${plans.map(p=>`<tr><td>${p.name}</td><td>${omr(p.price)}</td><td>${PERIOD[p.period]||p.period}</td>
        <td>${H(p.max_children)}</td><td>${H(p.trial_days)} يوم</td>
        <td>${p.is_active?'<span class="pill ok">مفعّلة</span>':'<span class="pill gray">موقوفة</span>'}</td>
        <td><button class="linkbtn" onclick="PLAN_EDIT=${p.id};go('pricing')">تعديل</button>
          <button class="linkbtn" onclick="togglePlan(${p.id},${p.is_active?'false':'true'})">${p.is_active?'إيقاف':'تفعيل'}</button></td></tr>`).join('')}
      </table>`:'<div class="emptyst"><div class="em">💳</div>لا خطط بعد — أنشئ أوّل خطّة.</div>'}</div>`;
}
async function savePlan(id){
  const price=Math.round(parseFloat((document.getElementById('pl_price').value||'0').replace('٫','.'))*1000);
  const body={ name:val('pl_name'), price:price, currency:'OMR',
    period:document.getElementById('pl_period').value, max_children:parseInt(document.getElementById('pl_max').value||'1',10),
    trial_days:parseInt(document.getElementById('pl_trial').value||'0',10), is_active:document.getElementById('pl_active').checked };
  if(!body.name){ alert('أدخل اسم الخطّة'); return; }
  try{
    if(id){ await api(`/api/admin/plans/${id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}); }
    else { await api('/api/admin/plans',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}); }
    PLAN_EDIT=null; go('pricing');
  }catch(e){ alert(e.detail||'تعذّر الحفظ'); }
}
async function togglePlan(id,active){ try{ await api(`/api/admin/plans/${id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({is_active:active})}); go('pricing'); }catch(e){ alert('تعذّر'); } }

// ---------- الاشتراكات (عرض) ----------
const SUB_AR = {trial:'تجربة', active:'فعّال', expired:'منتهٍ', canceled:'ملغى'};
async function secSubs(c){
  let subs; try{ subs=await api('/api/admin/subscriptions'); }catch(e){ c.innerHTML='<p class="err">تعذّر التحميل</p>'; return; }
  c.innerHTML = `<h2 class="sec">الاشتراكات</h2><div class="muted">${H(subs.length)} اشتراك.</div>
    <div class="panel">${subs.length?`<table><tr><th>وليّ الأمر</th><th>الخطّة</th><th>الحالة</th><th>حتى</th></tr>
    ${subs.map(s=>`<tr><td>${s.user||'—'}</td><td>${s.plan||'—'}</td>
      <td><span class="pill ${s.status==='active'||s.status==='trial'?'ok':'gray'}">${SUB_AR[s.status]||s.status}</span></td>
      <td>${s.access_until?day(s.access_until):'—'}</td></tr>`).join('')}</table>`:'<div class="emptyst"><div class="em">🔁</div>لا اشتراكات بعد.</div>'}</div>`;
}

// ---------- طرق الدفع (تحكّم المالك بالطرق الظاهرة + تفاصيل التحويل) ----------
const onbox = (id,on,lbl)=>`<label class="frow" style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" id="${id}" ${on?'checked':''} style="width:auto"> ${lbl}</label>`;

// ---------- الدول / المناهج (التحكّم بالدول الظاهرة لوليّ الأمر) ----------
const GCC = [["SA","السعودية"],["AE","الإمارات"],["QA","قطر"],["KW","الكويت"],["OM","عُمان"],["BH","البحرين"]];
async function secCountries(c){
  let s; try{ s=await api('/api/admin/settings'); }catch(e){ c.innerHTML='<p class="err">تعذّر التحميل</p>'; return; }
  const disabled = new Set((s.countries_disabled||'').split(',').filter(Boolean));
  c.innerHTML = `<h2 class="sec">الدول / المناهج</h2>
    <div class="muted">اختر الدول (المناهج) التي تظهر لوليّ الأمر عند إضافة طفل. تعطيل دولة يُخفيها من قائمة الاختيار فقط — لا يحذف أي محتوى أو منهج.</div>
    <div class="panel"><h3>الدول الظاهرة لوليّ الأمر</h3>
      ${GCC.map(([code,name])=>onbox('co_'+code, !disabled.has(code), name)).join('')}
    </div>
    <button class="savebtn" onclick="saveCountries()">حفظ</button>
    <span id="co-msg" class="okmsg"></span>`;
}
async function saveCountries(){
  const disabled = GCC.filter(([code])=>!document.getElementById('co_'+code).checked).map(([code])=>code).join(',');
  try{ await api('/api/admin/settings',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({countries_disabled:disabled})});
    const m=document.getElementById('co-msg'); m.textContent='تم الحفظ ✓'; setTimeout(()=>m.textContent='',2000);
  }catch(e){ alert('تعذّر الحفظ'); }
}

async function secPayMethods(c){
  let s; try{ s=await api('/api/admin/settings'); }catch(e){ c.innerHTML='<p class="err">تعذّر التحميل</p>'; return; }
  c.innerHTML = `<h2 class="sec">طرق الدفع</h2>
    <div class="muted">اختر الطرق التي تظهر للعميل، واملأ تفاصيل التحويل اليدوي.</div>
    <div class="panel"><h3>الطرق الظاهرة للعميل</h3>
      ${onbox('pm_visa', (s.pay_visa_on||'1')==='1', 'بطاقة / فيزا (تلقائيّة)')}
      ${onbox('pm_bank', s.pay_bank_on==='1', 'تحويل بنكي (يدوي — بإيصال)')}
      ${onbox('pm_phone', s.pay_phone_on==='1', 'تحويل لرقم هاتف (يدوي — بإيصال)')}
    </div>
    <div class="panel"><h3>تفاصيل التحويل البنكي</h3>
      <div class="frow"><label>الحساب البنكي (اسم البنك، رقم الحساب/الآيبان)</label>
        <textarea id="pm_bankd" rows="3" placeholder="بنك … — الحساب: …  — الآيبان: OM…">${(s.pay_bank||'').replace(/</g,'&lt;')}</textarea></div>
    </div>
    <div class="panel"><h3>تفاصيل التحويل لرقم هاتف</h3>
      <div class="frow"><label>رقم الهاتف للتحويل</label><input id="pm_phoned" value="${(s.pay_phone||'').replace(/"/g,'&quot;')}" placeholder="٩٦٨٩XXXXXXXX"></div>
    </div>
    <button class="savebtn" onclick="savePayMethods()">حفظ</button>
    <span id="pm-msg" class="okmsg"></span>`;
}
async function savePayMethods(){
  const body={
    pay_visa_on: document.getElementById('pm_visa').checked?'1':'',
    pay_bank_on: document.getElementById('pm_bank').checked?'1':'',
    pay_phone_on: document.getElementById('pm_phone').checked?'1':'',
    pay_bank: document.getElementById('pm_bankd').value,
    pay_phone: document.getElementById('pm_phoned').value,
  };
  try{ await api('/api/admin/settings',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const m=document.getElementById('pm-msg'); m.textContent='تم الحفظ ✓'; setTimeout(()=>m.textContent='',2000);
  }catch(e){ alert('تعذّر الحفظ'); }
}

// ---------- الإيصالات (مراجعة المالك) ----------
const REC_AR = {pending:'قيد المراجعة', approved:'مقبول', rejected:'مرفوض'};
let REC_FILTER='pending';
async function secReceipts(c){
  let recs; try{ recs=await api('/api/admin/receipts'+(REC_FILTER?('?status='+REC_FILTER):'')); }catch(e){ c.innerHTML='<p class="err">تعذّر التحميل</p>'; return; }
  const tab=(k,l)=>`<button class="${REC_FILTER===k?'on':''}" onclick="REC_FILTER='${k}';go('receipts')">${l}</button>`;
  c.innerHTML = `<h2 class="sec">الإيصالات</h2><div class="muted">راجِع إيصالات الدفع اليدوي.</div>
    <div class="tabs" style="margin:10px 0">${tab('pending','قيد المراجعة')}${tab('approved','المقبولة')}${tab('rejected','المرفوضة')}${tab('','الكل')}</div>
    <div class="panel">${recs.length?`<table><tr><th>وليّ الأمر</th><th>الخطّة</th><th>الطريقة</th><th>المبلغ</th><th>التاريخ</th><th>الحالة</th><th></th></tr>
    ${recs.map(r=>`<tr><td>${r.user||'—'}</td><td>${r.plan||'—'}</td><td>${r.method}</td><td>${omr(r.amount)}</td>
      <td>${day(r.created_at)}</td>
      <td><span class="pill ${r.status==='approved'?'ok':(r.status==='rejected'?'gray':'warn')}">${REC_AR[r.status]||r.status}</span>${r.note?`<div class="muted" style="font-size:11px">${r.note}</div>`:''}</td>
      <td><button class="linkbtn" onclick="viewReceipt(${r.id})">عرض</button></td></tr>`).join('')}</table>`
    :'<div class="emptyst"><div class="em">🧾</div>لا إيصالات في هذا التصنيف.</div>'}</div>`;
}
async function viewReceipt(id){
  let r; try{ r=await api(`/api/admin/receipts/${id}`); }catch(e){ alert('تعذّر فتح الإيصال'); return; }
  const isPdf=/^data:application\/pdf/i.test(r.file);
  const viewer=isPdf
    ? `<embed src="${r.file}" type="application/pdf" style="width:100%;height:60vh;border:1px solid #E3DACB;border-radius:10px">`
    : `<img src="${r.file}" alt="إيصال" style="max-width:100%;border:1px solid #E3DACB;border-radius:10px">`;
  const actions = r.status==='pending'
    ? `<div style="display:flex;gap:8px;margin-top:12px">
         <button class="savebtn" style="margin:0" onclick="approveReceipt(${r.id})">قبول وتفعيل الاشتراك</button>
         <button class="linkbtn" onclick="rejectReceipt(${r.id})">رفض…</button></div>`
    : `<div class="muted" style="margin-top:10px">الحالة: ${REC_AR[r.status]||r.status}${r.note?` — ${r.note}`:''}</div>`;
  modal(`<h3>إيصال — ${r.user||''}</h3>
    <div class="muted" style="margin-bottom:8px">${r.plan||'—'} · ${r.method} · ${omr(r.amount)} · ${day(r.created_at)}${r.filename?` · ${r.filename}`:''}</div>
    ${viewer}${actions}`);
}
async function approveReceipt(id){
  try{ await api(`/api/admin/receipts/${id}/approve`,{method:'POST'}); closeModal(); go('receipts'); }
  catch(e){ alert(e.detail||'تعذّر القبول'); }
}
async function rejectReceipt(id){
  const note=prompt('سبب الرفض (يظهر للعميل):','');
  if(note===null) return;
  try{ await api(`/api/admin/receipts/${id}/reject`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({note})}); closeModal(); go('receipts'); }
  catch(e){ alert(e.detail||'تعذّر الرفض'); }
}

boot();
</script>
</body>
</html>
