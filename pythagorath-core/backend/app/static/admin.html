<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة الإدارة — فيثاغورث</title>
<link rel="stylesheet" href="/static/brand.css">
<style>
  *{ box-sizing:border-box; }
  html,body{ margin:0; }
  body{ font-family:'Readex Pro',sans-serif; color:#2C2620; background:#F6F4EF; min-height:100vh; }
  a{ color:inherit; }
  .gate{ max-width:380px; margin:12vh auto; background:#fff; border:1px solid #EFE7DA; border-radius:18px; padding:26px; box-shadow:0 18px 36px -24px rgba(21,94,125,.5); }
  .gate h1{ font-family:'Baloo Bhaijaan 2',cursive; color:#155E7D; font-size:22px; margin:0 0 6px; }
  .gate p{ color:#8A8178; font-size:14px; margin:0 0 14px; }
  .gate input{ width:100%; margin:6px 0; padding:11px 13px; border:1.5px solid #E3DACB; border-radius:12px; font-family:inherit; font-size:15px; }
  .gate button{ width:100%; margin-top:8px; border:0; border-radius:13px; padding:12px; cursor:pointer; font-family:'Baloo Bhaijaan 2',cursive; font-weight:800; font-size:16px; color:#fff; background:linear-gradient(135deg,#163E52,#1B6E97); }
  .gate .err{ color:#C0392B; font-size:13px; min-height:18px; }

  .shell{ display:flex; min-height:100vh; }
  .side{ flex:0 0 232px; background:linear-gradient(180deg,#163E52,#114457); color:#fff; padding:18px 14px; position:sticky; top:0; height:100vh; overflow:auto; }
  .brand{ font-family:'Baloo Bhaijaan 2',cursive; font-weight:800; font-size:20px; margin:4px 8px 4px; }
  .brand .sub{ display:block; font-size:12px; color:rgba(255,255,255,.6); font-weight:400; font-family:'Readex Pro',sans-serif; }
  .navgrp{ margin-top:16px; }
  .navgrp .lbl{ font-size:11.5px; color:rgba(255,255,255,.5); margin:14px 10px 6px; font-weight:700; letter-spacing:.3px; }
  .nav{ display:flex; align-items:center; gap:9px; width:100%; text-align:right; background:none; border:0; color:rgba(255,255,255,.86);
        font-family:'Readex Pro',sans-serif; font-size:14.5px; font-weight:600; padding:10px 11px; border-radius:11px; cursor:pointer; }
  .nav:hover{ background:rgba(255,255,255,.08); }
  .nav.active{ background:rgba(255,255,255,.16); color:#fff; }
  .nav .ic{ width:18px; text-align:center; }
  .nav .soon{ margin-inline-start:auto; font-size:10.5px; background:rgba(255,255,255,.18); border-radius:999px; padding:2px 7px; }
  .logout{ margin-top:18px; color:rgba(255,255,255,.7); font-size:13px; background:none; border:1px solid rgba(255,255,255,.2); border-radius:10px; padding:8px; width:100%; cursor:pointer; }

  .main{ flex:1; padding:24px 26px 60px; max-width:1100px; }
  h2.sec{ font-family:'Baloo Bhaijaan 2',cursive; font-size:22px; color:#155E7D; margin:0 0 4px; }
  .muted{ color:#8A8178; font-size:14px; }
  .cards{ display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:14px; margin:16px 0; }
  .stat{ background:#fff; border:1px solid #EFE7DA; border-radius:16px; padding:16px 18px; box-shadow:0 12px 26px -22px rgba(21,94,125,.6); }
  .stat .big{ font-family:'Baloo Bhaijaan 2',cursive; font-weight:800; font-size:30px; color:#155E7D; }
  .stat.orange .big{ color:#D97E0A; } .stat.green .big{ color:#1E945B; } .stat.cyan .big{ color:#178FC9; }
  .stat .lbl{ color:#8A8178; font-size:13.5px; margin-top:3px; }
  .panel{ background:#fff; border:1px solid #EFE7DA; border-radius:16px; padding:18px; margin:14px 0; box-shadow:0 12px 26px -22px rgba(21,94,125,.55); }
  .panel h3{ font-family:'Baloo Bhaijaan 2',cursive; font-size:16px; color:#1B6E45; margin:0 0 12px; }
  .bars{ display:flex; align-items:flex-end; gap:10px; height:120px; padding-top:8px; }
  .bar{ flex:1; display:flex; flex-direction:column; align-items:center; gap:5px; height:100%; justify-content:flex-end; }
  .bar .col{ width:70%; min-height:3px; background:linear-gradient(180deg,#37B6E6,#178FC9); border-radius:6px 6px 0 0; }
  .bar .n{ font-size:12px; font-weight:800; color:#155E7D; } .bar .d{ font-size:11px; color:#9A8F82; }
  table{ width:100%; border-collapse:collapse; font-size:14px; }
  th,td{ text-align:right; padding:9px 10px; border-bottom:1px solid #F0EADF; }
  th{ color:#8A8178; font-size:12.5px; font-weight:700; }
  tr.clickable{ cursor:pointer; } tr.clickable:hover{ background:#FBF7F0; }
  .pill{ display:inline-block; border-radius:999px; padding:2px 10px; font-size:12px; font-weight:700; }
  .pill.ok{ background:#E8F7EE; color:#1E945B; } .pill.warn{ background:#FFF1DA; color:#D97E0A; } .pill.gray{ background:#EEF1F4; color:#7C8893; }
  .search{ width:100%; max-width:320px; padding:10px 13px; border:1.5px solid #E3DACB; border-radius:12px; font-family:inherit; font-size:14px; margin:6px 0 12px; }
  .soonbox{ text-align:center; padding:48px 16px; color:#8A8178; }
  .soonbox .em{ font-size:40px; } .soonbox h3{ font-family:'Baloo Bhaijaan 2',cursive; color:#155E7D; font-size:20px; margin:10px 0 4px; }
  .linkbtn{ display:inline-block; margin-top:6px; background:#E6F4FB; color:#178FC9; border-radius:999px; padding:7px 15px; font-weight:700; font-size:13.5px; text-decoration:none; }
  .row2{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  select.sk{ padding:9px 12px; border:1.5px solid #E3DACB; border-radius:11px; font-family:inherit; font-size:14px; min-width:260px; }
  .err{ color:#C0392B; }
  .modal{ position:fixed; inset:0; background:rgba(18,42,54,.45); display:none; align-items:center; justify-content:center; padding:20px; z-index:50; }
  .modal.show{ display:flex; }
  .modal .box{ background:#fff; border-radius:18px; max-width:520px; width:100%; max-height:86vh; overflow:auto; padding:22px; }
  .modal h3{ font-family:'Baloo Bhaijaan 2',cursive; color:#155E7D; margin:0 0 8px; }
  .x{ float:left; cursor:pointer; color:#9A8F82; border:0; background:none; font-size:20px; }
</style>
</head>
<body>
<div id="app"><div class="gate"><p>… جارٍ التحميل</p></div></div>
<script>
const H = n => String(n==null?'':n).replace(/[0-9]/g, d => '٠١٢٣٤٥٦٧٨٩'[+d]);
const CO = {SA:'السعودية',QA:'قطر',BH:'البحرين',KW:'الكويت',OM:'عُمان',AE:'الإمارات'};
const day = s => s ? H(String(s).slice(0,10)) : '—';
async function api(path, opts){
  const r = await fetch(path, opts);
  if(!r.ok){ const e=new Error('حدث خطأ'); e.status=r.status; try{e.detail=(await r.json()).detail;}catch(_){} throw e; }
  return r.status===204 ? null : r.json();
}

const SECTIONS = [
  {grp:'الإدارة', items:[
    {id:'overview', ic:'🏠', name:'الرئيسية'},
    {id:'students', ic:'🧒', name:'الطلّاب'},
    {id:'parents', ic:'👪', name:'أولياء الأمور'},
  ]},
  {grp:'المحتوى والجودة', items:[
    {id:'questions', ic:'❓', name:'الأسئلة'},
    {id:'skills', ic:'🗂️', name:'المهارات'},
    {id:'reports', ic:'📊', name:'التقارير'},
  ]},
  {grp:'الاشتراك والتسعير', items:[
    {id:'pricing', ic:'💳', name:'التسعير والخطط', soon:true},
    {id:'subs', ic:'🔁', name:'الاشتراكات', soon:true},
  ]},
  {grp:'', items:[ {id:'settings', ic:'⚙️', name:'الإعدادات'} ]},
];
let CURRENT='overview';

async function boot(){
  let me=null;
  try{ me = await api('/api/auth/me'); }
  catch(e){ return showGate(); }
  if(me.role !== 'admin'){ return showForbidden(me.email); }
  renderShell();
  go('overview');
}

function showGate(){
  document.getElementById('app').innerHTML = `<div class="gate">
    <h1>لوحة الإدارة</h1><p>هذه اللوحة للمالك فقط. سجّل الدخول.</p>
    <input id="ge" type="email" placeholder="البريد"><input id="gp" type="password" placeholder="كلمة السر">
    <div class="err" id="gerr"></div>
    <button onclick="doLogin()">دخول</button></div>`;
}
function showForbidden(email){
  document.getElementById('app').innerHTML = `<div class="gate">
    <h1>غير مصرَّح</h1><p>الحساب «${email||''}» ليس مالكاً. هذه اللوحة للمالك فقط.</p>
    <button onclick="logout()">تسجيل الخروج</button></div>`;
}
async function doLogin(){
  const email=document.getElementById('ge').value.trim(), password=document.getElementById('gp').value;
  try{ await api('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})}); boot(); }
  catch(e){ document.getElementById('gerr').textContent = e.detail || 'بريد أو كلمة سر غير صحيحة'; }
}
async function logout(){ try{ await api('/api/auth/logout',{method:'POST'}); }catch(e){} location.reload(); }

function renderShell(){
  let nav='';
  for(const g of SECTIONS){
    if(g.grp) nav += `<div class="lbl">${g.grp}</div>`;
    for(const it of g.items){
      nav += `<button class="nav" data-id="${it.id}" onclick="go('${it.id}')"><span class="ic">${it.ic}</span>${it.name}${it.soon?'<span class="soon">قريباً</span>':''}</button>`;
    }
  }
  document.getElementById('app').innerHTML = `<div class="shell">
    <aside class="side">
      <div class="brand">فيثاغورث<span class="sub">لوحة الإدارة</span></div>
      <div class="navgrp">${nav}</div>
      <button class="logout" onclick="logout()">تسجيل الخروج</button>
    </aside>
    <main class="main" id="content"></main>
    <div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="box" id="modalBox"></div></div>
  </div>`;
}
function go(id){
  CURRENT=id;
  document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active', b.dataset.id===id));
  const c=document.getElementById('content'); c.innerHTML='<p class="muted">… جارٍ التحميل</p>';
  ({overview:secOverview, students:secStudents, parents:secParents, questions:secQuestions,
    skills:secSkills, reports:secReports, pricing:secSoon, subs:secSoon, settings:secSettings}[id])(c);
}
function closeModal(){ document.getElementById('modal').classList.remove('show'); }
function modal(html){ document.getElementById('modalBox').innerHTML=`<button class="x" onclick="closeModal()">✕</button>`+html; document.getElementById('modal').classList.add('show'); }

const stat = (cls,n,lbl)=>`<div class="stat ${cls}"><div class="big">${H(n)}</div><div class="lbl">${lbl}</div></div>`;
function struggleTable(rows){
  if(!rows.length) return '<div class="muted">لا تعثّر مُسجَّل بعد.</div>';
  return `<table><tr><th>المهارة</th><th>نسبة الخطأ</th><th>عالقون</th><th>محاولات</th></tr>${
    rows.map(r=>`<tr><td>${r.name}</td><td><span class="pill ${r.error_rate>=50?'warn':'gray'}">${H(r.error_rate)}٪</span></td><td>${H(r.stuck)}</td><td>${H(r.attempts)}</td></tr>`).join('')}</table>`;
}

// ---------- الرئيسية ----------
async function secOverview(c){
  let d; try{ d=await api('/api/admin/overview'); }catch(e){ c.innerHTML='<p class="err">تعذّر التحميل</p>'; return; }
  const ch=d.content_health, mx=Math.max(1, ...d.activity_7d.map(a=>a.answers));
  c.innerHTML = `<h2 class="sec">نظرة عامّة</h2><div class="muted">حالة المنصّة الآن — كله من بيانات الأطفال الفعلية.</div>
    <div class="cards">
      ${stat('green', d.cards.parents, 'وليّ أمر')}
      ${stat('cyan', d.cards.children, 'طفل')}
      ${stat('orange', d.cards.active_week, 'نشِط هذا الأسبوع')}
    </div>
    <div class="panel"><h3>النشاط آخر ٧ أيّام</h3>
      <div class="bars">${d.activity_7d.map(a=>`<div class="bar"><div class="n">${H(a.answers)}</div><div class="col" style="height:${Math.round(100*a.answers/mx)}%"></div><div class="d">${H(a.date.slice(5))}</div></div>`).join('')}</div>
      <div class="muted" style="margin-top:8px">العمود = عدد الإجابات في اليوم.</div>
    </div>
    <div class="cards">
      ${stat('', ch.skills, 'مهارة')}
      ${stat('', ch.published_questions, 'سؤال منشور')}
      ${stat('', ch.curricula, 'منهج')}
      ${stat('orange', ch.needs_review, 'سؤال بحاجة مراجعة')}
    </div>
    <div class="panel"><h3>أكثر المهارات تعثّراً</h3>${struggleTable(d.struggled)}</div>`;
}

// ---------- الطلّاب ----------
let STUDENTS=[];
async function secStudents(c){
  try{ STUDENTS=await api('/api/admin/students'); }catch(e){ c.innerHTML='<p class="err">تعذّر التحميل</p>'; return; }
  c.innerHTML = `<h2 class="sec">الطلّاب</h2><div class="muted">${H(STUDENTS.length)} طفل. انقر صفّاً للتفاصيل.</div>
    <input class="search" id="ssearch" placeholder="بحث بالاسم أو وليّ الأمر…" oninput="renderStudents()">
    <div class="panel" id="stbl"></div>`;
  renderStudents();
}
function renderStudents(){
  const q=(document.getElementById('ssearch').value||'').trim();
  const rows=STUDENTS.filter(s=>!q || (s.name||'').includes(q) || (s.parent||'').includes(q));
  document.getElementById('stbl').innerHTML = rows.length ? `<table>
    <tr><th>الاسم</th><th>الصف</th><th>المنهج</th><th>وليّ الأمر</th><th>إجابات</th><th>مُتقَنة</th><th>كوينز</th><th>آخر نشاط</th></tr>
    ${rows.map(s=>`<tr class="clickable" onclick="studentDetail(${s.id})">
      <td>${s.name}${s.diagnosed?'':' <span class="pill gray">لم يُشخَّص</span>'}</td><td>${s.grade||'—'}</td><td>${CO[s.country]||'—'}</td>
      <td>${s.parent||'—'}</td><td>${H(s.answers)}</td><td>${H(s.mastered)}</td><td>${H(s.coins)}</td><td>${day(s.last_active)}</td></tr>`).join('')}
    </table>` : '<div class="muted">لا نتائج.</div>';
}
async function studentDetail(id){
  let d; try{ d=await api(`/api/admin/students/${id}`); }catch(e){ alert('تعذّر التحميل'); return; }
  const t=d.totals;
  modal(`<h3>${d.child.name}</h3>
    <div class="muted">${d.child.grade||''} · ${CO[d.child.country]||'—'} · وليّ الأمر: ${d.child.parent||'—'}</div>
    <div class="cards" style="margin:12px 0">${stat('green',t.mastered,'مُتقَنة')}${stat('cyan',t.understood,'مفهومة')}${stat('orange',t.answers,'إجابة')}${stat('',d.child.coins,'كوينز 🪙')}</div>
    <h3 style="font-size:15px">آخر ما أتقن</h3>${d.mastered.length?('<ul>'+d.mastered.map(m=>`<li>${m}</li>`).join('')+'</ul>'):'<div class="muted">لا شيء بعد.</div>'}
    <h3 style="font-size:15px">آخر الإجابات</h3>${d.recent.length?`<table>${d.recent.map(r=>`<tr><td>${r.correct?'✅':'❌'}</td><td>${r.skill}</td><td class="muted">${day(r.at)}</td></tr>`).join('')}</table>`:'<div class="muted">لا إجابات بعد.</div>'}`);
}

// ---------- أولياء الأمور ----------
async function secParents(c){
  let d; try{ d=await api('/api/admin/parents'); }catch(e){ c.innerHTML='<p class="err">تعذّر التحميل</p>'; return; }
  c.innerHTML = `<h2 class="sec">أولياء الأمور</h2><div class="muted">${H(d.length)} وليّ أمر.</div>
    <div class="panel">${d.length?`<table><tr><th>البريد</th><th>عدد الأطفال</th><th>انضمّ</th></tr>
    ${d.map(p=>`<tr><td>${p.email}</td><td>${H(p.children)}</td><td>${day(p.joined)}</td></tr>`).join('')}</table>`:'<div class="muted">لا أولياء أمور بعد.</div>'}</div>`;
}

// ---------- الأسئلة ----------
let NODES=null;
async function secQuestions(c){
  if(!NODES){ try{ NODES=await api('/api/admin/nodes'); }catch(e){ c.innerHTML='<p class="err">تعذّر التحميل</p>'; return; } }
  c.innerHTML = `<h2 class="sec">الأسئلة</h2>
    <div class="muted">تصفّح أسئلة أي مهارة وإحصاءات الخطأ. للتعديل/النشر/التعليم استخدم المحرّر التفصيلي.</div>
    <div class="row2" style="margin:12px 0">
      <select class="sk" id="qskill" onchange="loadSkillQ()"><option value="">— اختر مهارة —</option>
        ${NODES.map(n=>`<option value="${n.id}">${n.name} (${n.code})</option>`).join('')}</select>
      <a class="linkbtn" href="/admin/editor" target="_blank">المحرّر التفصيلي ↗</a>
    </div>
    <div id="qbox"></div>`;
}
async function loadSkillQ(){
  const id=document.getElementById('qskill').value; const box=document.getElementById('qbox');
  if(!id){ box.innerHTML=''; return; }
  box.innerHTML='<p class="muted">… جارٍ التحميل</p>';
  let d; try{ d=await api(`/api/admin/skills/${id}/stats`); }catch(e){ box.innerHTML='<p class="err">تعذّر التحميل</p>'; return; }
  box.innerHTML = `<div class="panel"><h3>${d.skill.plain}</h3>
    <table><tr><th>العائلة</th><th>الحالة</th><th>السؤال</th><th>محاولات</th><th>نسبة الخطأ</th></tr>
    ${d.questions.map(q=>`<tr><td>${q.family||'—'}</td><td>${q.status==='published'?'<span class="pill ok">منشور</span>':'<span class="pill warn">مسوّدة</span>'}</td>
      <td>${q.prompt}</td><td>${H(q.attempts)}</td><td>${q.error_rate==null?'—':`<span class="pill ${q.error_rate>=50?'warn':'gray'}">${H(q.error_rate)}٪</span>`}</td></tr>`).join('')}</table></div>`;
}

// ---------- المهارات ----------
async function secSkills(c){
  if(!NODES){ try{ NODES=await api('/api/admin/nodes'); }catch(e){ c.innerHTML='<p class="err">تعذّر التحميل</p>'; return; } }
  c.innerHTML = `<h2 class="sec">المهارات</h2><div class="muted">${H(NODES.length)} مهارة في الشبكة.</div>
    <div class="panel"><table><tr><th>الكود</th><th>المهارة</th><th>منشورة</th><th>العائلات</th><th>قابلة للإتقان</th><th>مجّانية</th></tr>
    ${NODES.map(n=>`<tr><td class="muted">${n.code}</td><td>${n.name}</td><td>${H(n.snapshot.published_count)}</td>
      <td>${n.snapshot.published_families.join('، ')||'—'}</td>
      <td>${n.snapshot.masterable?'<span class="pill ok">نعم</span>':'<span class="pill warn">لا</span>'}</td>
      <td>${n.is_free?'<span class="pill gray">مجّانية</span>':''}</td></tr>`).join('')}</table></div>`;
}

// ---------- التقارير ----------
async function secReports(c){
  let d; try{ d=await api('/api/admin/reports'); }catch(e){ c.innerHTML='<p class="err">تعذّر التحميل</p>'; return; }
  c.innerHTML = `<h2 class="sec">التقارير</h2><div class="muted">أين يتعثّر الأطفال — المهارات الأصعب (من البيانات الفعلية).</div>
    <div class="panel"><h3>المهارات الأكثر تعثّراً</h3>${struggleTable(d.struggled)}</div>`;
}

// ---------- الإعدادات ----------
async function secSettings(c){
  let t='mutadarrij'; try{ t=(await api('/api/admin/theme')).theme; }catch(e){}
  c.innerHTML = `<h2 class="sec">الإعدادات</h2>
    <div class="panel"><h3>سمة العرض</h3><div class="row2">
      ${['mutadarrij','ameen','mutawwar'].map(x=>`<button class="linkbtn" style="border:0;cursor:pointer;${x===t?'background:#155E7D;color:#fff':''}" onclick="setTheme('${x}')">${({mutadarrij:'متدرّج',ameen:'أمين',mutawwar:'مطوّر'})[x]}</button>`).join('')}
    </div></div>
    <div class="soonbox"><div class="em">⚙️</div><h3>إعدادات أخرى — قريباً</h3><div>تُضاف مع الأنظمة القادمة.</div></div>`;
}
async function setTheme(x){ try{ await api('/api/admin/theme',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({theme:x})}); go('settings'); }catch(e){ alert('تعذّر'); } }

// ---------- placeholder (التسعير / الاشتراكات) ----------
function secSoon(c){
  const t = CURRENT==='pricing' ? 'التسعير والخطط' : 'الاشتراكات';
  c.innerHTML = `<h2 class="sec">${t}</h2>
    <div class="soonbox"><div class="em">🚧</div><h3>قريباً</h3>
      <div>يُبنى مع نظام الاشتراك (الخطوة ٧)، ثم يُربط بالتحكّم المركزي من هذه اللوحة.</div></div>`;
}

boot();
</script>
</body>
</html>
